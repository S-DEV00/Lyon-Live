<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c11">
<title>Lyon Live</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lyon Live">
<meta name="description" content="Carte live de la manif à Lyon : dangers, medics, eau, sorties sûres.">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" type="image/png" href="icone-180.png">
<link rel="manifest" href="manifest.json">
<script src="config.js"></script>
<link rel="stylesheet" href="leaflet.css">
<script src="leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --rose:#ff5caa; --rose2:#ff8cc4; --noir:#09090b; --s1:#121216; --s2:#1b1b21; --s3:#26262e; --ligne:#2e2e38;
    --txt:#f4f4f6; --doux:#9b9ba8; --danger:#ff3b4e; --sur:#16c784; --info:#4f7cff; --orange:#ff9f1c; --jaune:#ffd23f;
    --haut:env(safe-area-inset-top); --bas:env(safe-area-inset-bottom);
    --verre:rgba(12,12,15,.82); --ombre:0 10px 30px rgba(0,0,0,.45);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--noir); color:var(--txt); overflow:hidden;
              font-family:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; -webkit-user-select:none; user-select:none; -webkit-font-smoothing:antialiased; }
  input, textarea { -webkit-user-select:text; user-select:text; }
  #carte { position:fixed; inset:0; bottom:auto; height:100vh; height:100lvh; min-height:100%; background:#141418; }
  html { background:#141418; min-height:calc(100% + env(safe-area-inset-bottom)); }
  .anton { font-family:Anton,Impact,sans-serif; letter-spacing:.5px; text-transform:uppercase; font-weight:400; }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; padding:0; }
  svg.ic { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .verre { background:var(--verre); -webkit-backdrop-filter:blur(18px) saturate(1.4); backdrop-filter:blur(18px) saturate(1.4); border:1px solid rgba(255,255,255,.08); }

  /* ---------- Écran de démarrage ---------- */
  #splash { position:fixed; inset:0; z-index:5000; background:#09090b; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity .5s, transform .5s; }
  #splash.parti { opacity:0; transform:scale(1.06); pointer-events:none; }
  #splash, #bienvenue.accueil { bottom:auto; height:100vh; height:100lvh; min-height:100%; }
  #splash::after { content:""; position:absolute; left:0; right:0; bottom:0; height:30%; background:linear-gradient(transparent, #09090b 75%); pointer-events:none; }
  .sp-bas { z-index:1; }
  #splash::before { content:""; position:absolute; inset:-20%; background:radial-gradient(circle at 50% 40%, #ff5caa40 0%, transparent 42%), radial-gradient(circle at 15% 90%, #4f7cff30 0%, transparent 40%), radial-gradient(circle at 90% 10%, #ff5caa22 0%, transparent 35%); animation:sp-respire 5s ease-in-out infinite; }
  @keyframes sp-respire { 50% { transform:scale(1.08) rotate(3deg); } }
  .sp-grille { position:absolute; inset:0; opacity:.22; background-image:linear-gradient(#ffffff14 1px, transparent 1px), linear-gradient(90deg, #ffffff14 1px, transparent 1px); background-size:34px 34px;
    -webkit-mask-image:radial-gradient(circle at 50% 42%, #000 0%, transparent 70%); mask-image:radial-gradient(circle at 50% 42%, #000 0%, transparent 70%); transform:perspective(500px) rotateX(35deg) scale(1.6); transform-origin:50% 70%; }
  .sp-centre { position:relative; display:flex; flex-direction:column; align-items:center; margin-top:-6vh; }
  .sp-logo { position:relative; width:150px; height:150px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; }
  .sp-logo svg { width:78px; height:78px; position:relative; filter:drop-shadow(0 8px 24px #ff5caa99); animation:flotte 2.2s ease-in-out infinite; }
  .sp-logo i { position:absolute; inset:0; border-radius:50%; border:2px solid #ff5caa; opacity:0; animation:sp-onde 2.4s ease-out infinite; }
  .sp-logo i:nth-child(2) { animation-delay:.8s; } .sp-logo i:nth-child(3) { animation-delay:1.6s; }
  @keyframes sp-onde { 0% { transform:scale(.3); opacity:.9; } 100% { transform:scale(1.25); opacity:0; } }
  @keyframes flotte { 50% { transform:translateY(-7px); } }
  #splash h1 { margin:0; font-family:Anton,Impact,sans-serif; font-weight:400; font-size:76px; line-height:.92; letter-spacing:1px; text-align:center; display:flex; flex-direction:column; }
  #splash h1 span { color:#fff; } #splash h1 b { font-weight:400; background:linear-gradient(90deg,#ff5caa,#ff9ad0,#ff5caa); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:sp-brille 2.5s linear infinite; }
  @keyframes sp-brille { to { background-position:-200% 0; } }
  .sp-tag { margin-top:18px; display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:30px; background:#ffffff0f; border:1px solid #ffffff1a; color:#e6e6ea; font-size:12.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; }
  .sp-pt { width:8px; height:8px; border-radius:50%; background:#ff3b4e; box-shadow:0 0 0 0 #ff3b4e; animation:sp-live 1.4s infinite; }
  @keyframes sp-live { 70% { box-shadow:0 0 0 8px #ff3b4e00; } 100% { box-shadow:0 0 0 0 #ff3b4e00; } }
  .sp-bas { position:absolute; bottom:calc(var(--bas) + 46px); bottom:calc(100% - 100svh + var(--bas) + 46px); display:flex; flex-direction:column; align-items:center; gap:10px; color:var(--doux); font-size:12px; }
  #splash .barre-ch { width:160px; height:3px; border-radius:2px; background:#ffffff1a; overflow:hidden; }
  #splash .barre-ch i { display:block; height:100%; width:40%; background:var(--rose); border-radius:2px; animation:charge 1.1s ease-in-out infinite; }
  @keyframes charge { from { transform:translateX(-100%); } to { transform:translateX(260%); } }

  /* ---------- En-tête ---------- */
  #haut { position:fixed; top:0; left:0; right:0; z-index:1000; padding:calc(var(--haut) + 8px) 10px 0; pointer-events:none; }
  .barre { display:flex; align-items:center; gap:10px; border-radius:18px; padding:8px 8px 8px 14px; pointer-events:auto; box-shadow:var(--ombre); }
  #titre { font-size:22px; line-height:1; white-space:nowrap; flex:1; }
  #titre b { color:var(--rose); font-weight:400; }
  #direct { font-size:10.5px; font-weight:800; letter-spacing:.8px; color:var(--doux); display:flex; align-items:center; gap:6px; white-space:nowrap; }
  #point-direct { width:8px; height:8px; border-radius:50%; background:var(--rose); animation:pulse 2s infinite; }
  #point-direct.hs { background:#666; animation:none; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 #ff5caa99} 70%{box-shadow:0 0 0 8px #ff5caa00} 100%{box-shadow:0 0 0 0 #ff5caa00} }
  #role-badge { display:none; font-size:10px; font-weight:800; color:#000; background:var(--rose); padding:4px 7px; border-radius:7px; letter-spacing:.6px; }
  #role-badge.medic { background:var(--sur); }
  #btn-son { width:36px; height:36px; border-radius:12px; background:var(--s3); display:flex; align-items:center; justify-content:center; color:var(--txt); }
  #btn-son.off { color:var(--doux); }
  #ticker { display:none; margin-top:8px; pointer-events:auto; width:100%; text-align:left; border-radius:16px; padding:10px 12px 10px 14px; box-shadow:var(--ombre); position:relative; overflow:hidden; }
  #ticker::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--info); }
  #ticker.vu { display:block; }
  #ticker.important::before { background:var(--orange); }
  #ticker.epingle::before { background:var(--rose); }
  #ticker.urgent { background:rgba(60,8,14,.88); } #ticker.urgent::before { background:var(--danger); }
  #ticker .t1 { font-size:10.5px; color:var(--doux); font-weight:800; letter-spacing:.6px; text-transform:uppercase; margin-bottom:3px; display:flex; justify-content:space-between; }
  #ticker .t2 { font-size:15px; font-weight:600; line-height:1.3; }
  .info-etiq span { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  #compteurs { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; pointer-events:auto; }
  .pastille { font-size:12px; font-weight:700; padding:6px 10px; border-radius:20px; display:flex; align-items:center; gap:6px; }
  .pastille i { width:8px; height:8px; border-radius:50%; display:inline-block; }

  /* ---------- Boutons flottants ---------- */
  #flottants { position:fixed; right:10px; bottom:calc(var(--bas) + 100px); z-index:1000; display:flex; flex-direction:column; gap:10px; }
  .rond { width:48px; height:48px; border-radius:16px; display:flex; align-items:center; justify-content:center; box-shadow:var(--ombre); color:var(--txt); }
  .rond:active { transform:scale(.93); }

  /* ---------- Barre d'onglets ---------- */
  #onglets { position:fixed; left:10px; right:10px; bottom:calc(var(--bas) + 10px); z-index:1000; display:flex; gap:4px; padding:6px; border-radius:24px; box-shadow:var(--ombre); }
  .onglet { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:8px 2px 7px; border-radius:18px; font-size:10.5px; font-weight:700; color:#b9b9c4; position:relative; letter-spacing:.2px; }
  .onglet:active { background:var(--s3); }
  .onglet.fort { background:var(--rose); color:#000; box-shadow:0 4px 16px #ff5caa55; }
  .onglet.fort.vert { background:var(--sur); box-shadow:0 4px 16px #16c78455; }
  .onglet.actif { color:var(--sur); }
  .onglet .badge { position:absolute; top:4px; left:50%; margin-left:5px; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--danger); color:#fff;
                   font-size:10.5px; font-weight:800; display:none; align-items:center; justify-content:center; border:2px solid #121216; }
  .onglet .badge.vu { display:flex; }

  /* ---------- Marqueurs ---------- */
  .pin { width:36px; height:36px; border-radius:50% 50% 50% 6px; transform:rotate(-45deg); display:flex; align-items:center; justify-content:center;
         border:2.5px solid #fff; box-shadow:0 4px 12px rgba(0,0,0,.55); position:relative; }
  .pin svg { transform:rotate(45deg); width:19px; height:19px; fill:none; stroke:#fff; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .pin.danger { background:var(--danger); } .pin.sur { background:var(--sur); } .pin.info { background:var(--info); } .pin.orange { background:#ff8a1f; }
  .pin.vieux { opacity:.5; filter:saturate(.3); }
  .pin.neuf::after { content:""; position:absolute; inset:-9px; border-radius:50%; border:2px solid var(--rose); animation:onde 1.6s infinite; }
  @keyframes onde { from{transform:scale(.7);opacity:1} to{transform:scale(1.35);opacity:0} }
  .pin .nb { position:absolute; top:-9px; right:-9px; transform:rotate(45deg); background:#fff; color:var(--danger); font-size:11px; font-weight:800;
             min-width:20px; height:20px; border-radius:10px; display:flex; align-items:center; justify-content:center; padding:0 4px; box-shadow:0 2px 6px #0008; }
  .bulle { padding:6px 10px; border-radius:14px 14px 14px 4px; background:#111116; border:2px solid var(--info); font-size:12px; font-weight:700; white-space:nowrap;
           max-width:190px; overflow:hidden; text-overflow:ellipsis; box-shadow:0 4px 12px #000a; transform:translate(0,-100%); display:inline-block; }
  .bulle.important { border-color:var(--orange); } .bulle.urgent { border-color:var(--danger); background:#3a0b12; }
  .bulle.medics { border-color:var(--sur); }
  .moi { width:18px; height:18px; border-radius:50%; background:#3d8bff; border:3px solid #fff; box-shadow:0 0 0 7px #3d8bff40; }
  .medic-live { width:34px; height:34px; border-radius:50%; background:var(--sur); border:3px solid #fff; display:flex; align-items:center; justify-content:center; position:relative; box-shadow:0 3px 10px #0009; }
  .medic-live svg { width:16px; height:16px; fill:#fff; stroke:none; }
  .medic-live::before { content:""; position:absolute; inset:-3px; border-radius:50%; border:3px solid var(--sur); animation:onde 2s infinite; }
  .medic-live.occupe { background:var(--orange); } .medic-live.occupe::before { border-color:var(--orange); }
  .medic-live.pause { background:#666; } .medic-live.pause::before { display:none; }
  .medic-live .ps { position:absolute; top:36px; left:50%; transform:translateX(-50%); white-space:nowrap; font-size:11px; font-weight:800; background:#000c; padding:2px 6px; border-radius:6px; }
  .blesse { width:36px; height:36px; border-radius:10px; background:#fff; border:3px solid var(--danger); display:flex; align-items:center; justify-content:center; box-shadow:0 3px 10px #0009; position:relative; }
  .blesse svg { width:20px; height:20px; fill:none; stroke:var(--danger); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
  .blesse.grave { animation:clig 1s infinite; } @keyframes clig { 50% { box-shadow:0 0 0 8px #ff3b4e55; } }
  .blesse.moyen { border-color:var(--orange); } .blesse.moyen svg { stroke:var(--orange); }
  .blesse.leger { border-color:#d4a800; } .blesse.leger svg { stroke:#d4a800; }
  .blesse.prise::after { content:"✓"; position:absolute; top:-8px; right:-8px; width:18px; height:18px; border-radius:50%; background:var(--sur); color:#fff; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .station { width:13px; height:13px; border-radius:50%; background:#fff; border:3px solid #333; box-shadow:0 1px 4px #000a; }
  .station-nom { position:absolute; left:10px; top:-8px; white-space:nowrap; font-size:11px; font-weight:800; color:#fff; text-shadow:0 0 3px #000,0 0 3px #000,0 0 5px #000; display:flex; gap:3px; align-items:center; }
  body.fond-clair .station-nom { color:#222; text-shadow:0 0 2px #fff,0 0 3px #fff,0 0 5px #fff; }
  .ligne-badge { width:15px; height:15px; border-radius:50%; color:#fff; font-size:9px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; text-shadow:none; }
  .hosto { width:24px; height:24px; border-radius:7px; background:#d7263d; border:2px solid #fff; color:#fff; font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px #0009; }
  .pharma { width:16px; height:16px; border-radius:4px; background:#18a558; border:1.5px solid #fff; display:flex; align-items:center; justify-content:center; }
  .pharma svg { width:10px; height:10px; fill:#fff; }
  .repere span { position:absolute; transform:translate(-50%,-50%); white-space:nowrap; font-family:Anton,Impact,sans-serif; text-transform:uppercase;
                 font-size:12.5px; letter-spacing:.8px; color:#ff5caa; text-shadow:0 0 3px #000,0 0 3px #000,0 0 6px #000; pointer-events:none; opacity:.92; }
  body.zoom-loin .repere:not(.grand) span { display:none; }
  body.zoom-loin .repere.grand span { font-size:13.5px; }
  body.fond-clair .repere span { color:#d81b7a; text-shadow:0 0 2px #fff,0 0 3px #fff,0 0 5px #fff; }
  .nomrue span { position:absolute; white-space:nowrap; font-size:11px; font-weight:600; letter-spacing:.2px; pointer-events:none; }
  .sommet { width:14px; height:14px; border-radius:50%; background:#fff; border:3px solid var(--rose); }

  /* ---------- Feuilles ---------- */
  #voile { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:1500; display:none; }
  .feuille { position:fixed; left:0; right:0; bottom:0; z-index:1600; background:var(--s1); border-radius:26px 26px 0 0;
             padding:14px 16px calc(var(--bas) + 20px); max-height:88vh; overflow:auto; -webkit-overflow-scrolling:touch;
             transform:translateY(105%); transition:transform .26s cubic-bezier(.2,.8,.2,1); border-top:1px solid var(--ligne); box-shadow:0 -10px 40px #000a; }
  .feuille.ouverte { transform:none; }
  .feuille h2 { margin:0 0 3px; font-size:28px; line-height:1.05; }
  .sous { color:var(--doux); font-size:13px; margin-bottom:12px; line-height:1.45; }
  .poignee { width:38px; height:5px; border-radius:3px; background:#3a3a44; margin:0 auto 12px; }
  .entete-f { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:4px; }
  .fermer { width:34px; height:34px; border-radius:50%; background:var(--s3); display:flex; align-items:center; justify-content:center; flex:none; color:var(--doux); }
  .fermer svg { width:16px; height:16px; }
  .grille { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px; }
  .choix { background:var(--s2); border:2px solid transparent; border-radius:16px; padding:12px 4px 10px; text-align:center; font-size:11.5px; font-weight:600; line-height:1.2; display:flex; flex-direction:column; align-items:center; gap:7px; }
  .choix .pt { width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; }
  .choix .pt svg { width:19px; height:19px; fill:none; stroke:#fff; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .choix.sel { border-color:var(--rose); background:#2a1020; }
  label.l { display:block; font-size:11px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--doux); margin:16px 0 8px; }
  input, textarea { width:100%; background:var(--s2); color:var(--txt); border:1px solid var(--ligne); border-radius:14px; padding:13px; font:inherit; font-size:16px; }
  input:focus, textarea:focus { outline:none; border-color:var(--rose); }
  textarea { resize:none; height:78px; }
  .rangee { display:flex; gap:8px; margin-top:14px; }
  .btn { background:var(--s3); border:1px solid var(--ligne); border-radius:15px; padding:14px; font-size:15px; font-weight:700; text-align:center; text-decoration:none; color:var(--txt); display:flex; align-items:center; justify-content:center; gap:7px; }
  .btn.rose { background:var(--rose); color:#000; border-color:var(--rose); }
  .btn.vert { background:var(--sur); color:#00180d; border-color:var(--sur); }
  .btn.rouge { background:#3a1218; border-color:#6b1d28; color:#ff8a96; }
  .btn.petit { padding:9px 12px; font-size:13px; border-radius:12px; }
  .btn.plein { flex:1; }
  .btn:active { transform:scale(.97); }
  .btn[disabled] { opacity:.35; }
  .btn svg.ic { width:18px; height:18px; }
  .segments { display:flex; background:var(--s2); border-radius:14px; padding:4px; gap:4px; }
  .segments button { flex:1; padding:10px 4px; border-radius:10px; font-size:13px; font-weight:700; color:var(--doux); }
  .segments button.sel { background:var(--s3); color:var(--txt); box-shadow:0 2px 8px #0006; }
  .segments button.sel.info { background:#1c2b52; color:#c3d4ff; } .segments button.sel.important { background:#4d3510; color:#ffd59a; } .segments button.sel.urgent { background:#5c1420; color:#ffb8c0; }
  .segments button.sel.dispo { background:#0f3d2a; color:#7ff0b5; } .segments button.sel.occupe { background:#4d3510; color:#ffd59a; }
  .interrupteur { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 13px; background:var(--s2); border-radius:14px; margin-top:8px; font-size:14px; font-weight:500; }
  .interrupteur input { width:auto; transform:scale(1.3); accent-color:var(--rose); }
  .stepper { display:flex; align-items:center; gap:10px; }
  .stepper button { width:46px; height:46px; border-radius:14px; background:var(--s2); border:1px solid var(--ligne); font-size:22px; }
  .stepper output { font-size:28px; min-width:44px; text-align:center; font-family:Anton,Impact,sans-serif; }
  .liste-item { display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--s3); font-size:15px; font-weight:500; }
  .liste-item .pin { width:28px; height:28px; border-width:2px; flex:none; } .liste-item .pin svg { width:15px; height:15px; }
  .trait-ex { width:30px; height:6px; border-radius:3px; flex:none; }
  .puces { display:flex; gap:6px; flex-wrap:wrap; }
  .puces button { background:var(--s2); border:1px solid var(--ligne); border-radius:20px; padding:9px 13px; font-size:13.5px; font-weight:600; }
  .puces button.sel { background:var(--rose); color:#000; border-color:var(--rose); font-weight:800; }
  .carte-c { background:var(--s2); border-radius:16px; padding:13px 14px; margin-bottom:9px; font-size:14.5px; line-height:1.5; color:#ddd; }
  .carte-c h3 { margin:0 0 5px; font-size:15px; display:flex; align-items:center; gap:8px; color:var(--txt); }
  .carte-c b { color:var(--rose); }
  .detail-note { font-size:16px; line-height:1.45; margin:6px 0 10px; white-space:pre-wrap; word-break:break-word; }
  .vide { text-align:center; color:var(--doux); padding:26px 10px; font-size:14px; }
  .section { margin-top:18px; }
  .section-titre { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .section-titre h3 { margin:0; font-size:12px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--doux); }

  /* Messages */
  .msg { background:var(--s2); border-radius:16px; padding:12px 13px 12px 15px; margin-bottom:9px; position:relative; overflow:hidden; }

// ===================== PLACEMENT (point, blessé, ma position) =====================
var cible = null, brouillon = null;
function modeAide(html){ $('aide').innerHTML = html; }
function commencerPlacement(c){
  fermer(); cible = c; document.body.classList.add('placement');
  var txt = { evt:'le lieu de l\'événement', deplacer:'le nouvel emplacement du point', point:'l\'endroit à signaler', blesse:'l\'endroit où se trouve la personne blessée', position:'ta position actuelle' }[c];
  modeAide('Déplace la carte pour mettre l\'épingle sur <b>'+txt+'</b>, puis « Ici ».' + (c!=='position' ? '<br><span style="color:#9b9ba8">Astuce : un appui long sur la carte marche aussi.</span>' : ''));
  $('barre-mode').innerHTML = '<button class="btn plein verre" onclick="annulerModes()">Annuler</button><button class="btn rose plein" onclick="placerIci()">'+ic('position')+'Ici</button>';
}
function annulerModes(){ document.body.classList.remove('placement'); document.body.classList.remove('trace'); document.body.classList.remove('trace-doigt'); traceEnCours = null; if (typeof traceDoigt !== 'undefined' && traceDoigt) { traceDoigt = false; carte.dragging.enable(); } calqueDessin.clearLayers(); }
function placerIci(){ var c = carte.getCenter(); annulerModes(); placerA(c.lat, c.lng); }
function placerA(lat, lng){
  if (cible === 'point') { brouillon = { lat:lat, lng:lng, type:null, vehicules:1 }; formulaire(); }
  else if (cible === 'blesse') { brouillon = { lat:lat, lng:lng, gravite:'moyen', note:'' }; formulaireBlesse(); }
  else if (cible === 'deplacer' && aDeplacer) { serveur('modifierPoint', etat.mdp, aDeplacer, { lat:lat, lng:lng }).then(function(j){ appliquer(j); toast('Point déplacé'); }).catch(erreurEquipe); aDeplacer = null; }
  else if (cible === 'evt' && brouillonEvt) { brouillonEvt.lat = lat; brouillonEvt.lng = lng; formulaireEvt(); }
  else if (cible === 'position') { partage.mode = 'manuel'; partage.lat = lat; partage.lng = lng; demarrerPartage(); }
}
carte.on('contextmenu', function(e){
  if (!estEquipe() || document.body.classList.contains('trace')) return;
  annulerModes(); cible = estMedic() ? 'blesse' : 'point'; placerA(e.latlng.lat, e.latlng.lng);
});

// ----- Tracés : rendu -----
function longueurTrace(c){ var d = 0; for (var i = 1; i < c.length; i++) d += distance(c[i-1], c[i]); return d; }
function txtDistance(m){ return m < 1000 ? Math.round(m/10)*10 + ' m' : (m/1000).toFixed(1).replace('.', ',') + ' km'; }
function txtDuree(m, kmh){ var mn = Math.max(1, Math.round(m / (kmh*1000/60))); return mn < 60 ? mn + ' min' : Math.floor(mn/60) + ' h ' + ('0'+(mn%60)).slice(-2); }
function angleEntre(a, b){ return Math.atan2(b[0]-a[0], (b[1]-a[1])*Math.cos(b[0]*Math.PI/180)) * 180/Math.PI; }
function flecheIcone(ang, coul, taille){ taille = taille || 18;
  return L.divIcon({ className:'', iconSize:[taille,taille], iconAnchor:[taille/2,taille/2],
    html:'<svg class="chevron" width="'+taille+'" height="'+taille+'" viewBox="0 0 24 24" style="transform:rotate('+(-ang)+'deg)"><path d="M7 4 L17 12 L7 20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 4 L17 12 L7 20" fill="none" stroke="'+coul+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' }); }
function dessinerTrace(t, calque){
  var T = TRACES[t.type] || TRACES.cortege, c = t.coords;
  if (filtre==='danger' && T.g!=='danger') return;
  if (filtre==='sur' && T.g==='danger') return;
  var vieux = (maintenant() - t.ts) > VIEUX_MIN*60000, op = vieux ? .45 : 1;
  // contour sombre + halo coloré + ligne
  L.polyline(c, { color:'#09090b', weight:T.poids+6, opacity:vieux?.3:.7, lineCap:'round', lineJoin:'round', interactive:false }).addTo(calque);
  if (!vieux) L.polyline(c, { color:T.couleur, weight:T.poids+12, opacity:.16, lineCap:'round', lineJoin:'round', interactive:false, className:'tr-halo' }).addTo(calque);
  L.polyline(c, { color:T.couleur, weight:T.poids, dashArray:T.tirets, opacity:op, lineCap:'round', lineJoin:'round', interactive:false }).addTo(calque);
  if (T.anime && !vieux && !eco) L.polyline(c, { color:'#fff', weight:Math.max(2, T.poids-4), dashArray:'2 22', opacity:.75, lineCap:'round', interactive:false, className:'tr-flux' }).addTo(calque);
  L.polyline(c, { color:'#000', weight:28, opacity:0, lineCap:'round' }).on('click', function(){ ouvrirTrace(t.id); }).addTo(calque);
  // flèches de sens tous les ~250 m
  if (T.sens && c.length > 1) {
    var pas = 250, reste = pas * .6;
    for (var i = 1; i < c.length; i++) {
      var d = distance(c[i-1], c[i]), pos = reste;
      while (pos < d) { var f = pos / d, ll = [c[i-1][0] + (c[i][0]-c[i-1][0])*f, c[i-1][1] + (c[i][1]-c[i-1][1])*f];
        L.marker(ll, { interactive:false, keyboard:false, icon:flecheIcone(angleEntre(c[i-1], c[i]), T.couleur) }).addTo(calque); pos += pas; }
      reste = pos - d;
    }
  }
  // départ / arrivée
  if (T.sens && c.length > 1) {
    L.marker(c[0], { interactive:false, icon:L.divIcon({ className:'', iconSize:[22,22], iconAnchor:[11,11], html:'<div class="tr-depart" style="--tc:'+T.couleur+'"></div>' }) }).addTo(calque);
    L.marker(c[c.length-1], { icon:L.divIcon({ className:'', iconSize:[34,34], iconAnchor:[17,17], html:'<div class="tr-fin" style="--tc:'+T.couleur+'">'+(t.type==='cortege'||t.type==='prevu'?'🏁':T.e)+'</div>' }) })
      .on('click', function(){ ouvrirTrace(t.id); }).addTo(calque);
  } else if (c.length > 1) {
    var m = c[Math.floor((c.length-1)/2)], m2 = c[Math.floor((c.length-1)/2)+1] || m, mid = [(m[0]+m2[0])/2, (m[1]+m2[1])/2];
    L.marker(mid, { icon:L.divIcon({ className:'', iconSize:[30,30], iconAnchor:[15,15], html:'<div class="tr-fin" style="--tc:'+T.couleur+'">'+T.e+'</div>' }) })
      .on('click', function(){ ouvrirTrace(t.id); }).addTo(calque);
  }
}

// ----- Points -----
function typesAutorises(){ return estAdmin() ? Object.keys(TYPES) : ['medic','eau']; }
function formulaire(){
  var h = entete('Nouveau point', 'Qu\'est-ce que tu signales ?'), aut = typesAutorises();
  [['danger','🔴 À éviter'],['sur','🟢 Sûr / aide'],['info','🔵 Infos']].forEach(function(G){
    var ks = aut.filter(function(k){ return TYPES[k].g === G[0]; }); if (!ks.length) return;
    if (aut.length > 4) h += '<div class="grille-titre">'+G[1]+'</div>';
    h += '<div class="grille">';
    ks.forEach(function(k){ var t=TYPES[k];
      h += '<button class="choix'+(brouillon.type===k?' sel':'')+'" onclick="choisir(\''+k+'\')"><span class="pt" style="background:'+COULEURS_G[t.g]+'">'+emo(k)+'</span>'+esc(t.nom)+'</button>'; });
    h += '</div>';
  });
  if (brouillon.type && TYPES[brouillon.type].vehicules)
    h += '<label class="l">Nombre de véhicules</label><div class="stepper"><button onclick="pasB(-1)">−</button><output id="vehB">'+brouillon.vehicules+'</output><button onclick="pasB(1)">+</button></div>';
  if (brouillon.type === 'info') h += '<label class="l">Ton info (obligatoire, visible sur la carte)</label><div class="info-modeles">' + MODELES_INFO.map(function(m){ return '<button onclick="$(\'note\').value=\''+m.replace(/'/g,"\\'")+'\'">'+esc(m)+'</button>'; }).join('') + '</div>'
     + '<textarea id="note" maxlength="200" placeholder="ex : Toilettes ouvertes au café du coin">'+esc(brouillon.note||'')+'</textarea>';
  else h += '<label class="l">Précision (facultatif)</label><textarea id="note" maxlength="200" placeholder="ex : 2 camions + une dizaine d\'agents">'+esc(brouillon.note||'')+'</textarea>';
  h += ''
     + '<div class="sous" style="margin-top:8px">Pas de nom, pas de visage, pas d\'info perso sur qui que ce soit.</div>'
     + '<div class="rangee"><button class="btn plein" onclick="fermer()">Annuler</button><button id="pub" class="btn rose plein" onclick="publier()"'+(brouillon.type?'':' disabled')+'>Publier</button></div>';
  if ($('feuille').dataset.vue === 'form') rafraichirFeuille(h); else ouvrir(h, 'form');
}
function choisir(k){ brouillon.note = ($('note')||{}).value || brouillon.note; brouillon.type=k; formulaire(); }
function pasB(n){ brouillon.vehicules=Math.max(0,Math.min(99,brouillon.vehicules+n)); $('vehB').textContent=brouillon.vehicules; }
function pas(n){ var o=$('veh'); o.textContent=Math.max(0,Math.min(99,(+o.textContent)+n)); }
function publier(){
  if (brouillon.type === 'info' && !$('note').value.trim()) { $('note').focus(); return toast('Écris l\'info à afficher'); }
  brouillon.note = $('note').value; brouillon.par = etat.pseudo; $('pub').textContent='…'; $('pub').disabled = true;
  // Si le serveur ne connaît pas encore ce type, on l'enregistre comme "danger"/"rdv"/"info" avec le vrai type caché dans la note.
  var ANCIENS = ['police','controle','nasse','bloque','lacrymo','danger','medic','eau','rdv','sortie','tete','sauvage','info'];
  var envoi = brouillon;
  if (ANCIENS.indexOf(brouillon.type) < 0) {
    var g = TYPES[brouillon.type].g;
    envoi = Object.assign({}, brouillon, { type: g === 'danger' ? 'danger' : g === 'sur' ? 'rdv' : 'info', note: '[' + brouillon.type + '] ' + (brouillon.note || '') });
  }
  serveur('ajouterPoint', etat.mdp, envoi).then(function(j){ vus['p'+'_'] = 1; fermer(); var d=JSON.parse(j); d.points.forEach(function(p){ vus['p'+p.id]=1; }); appliquer(d); toast('Point publié'); })
    .catch(function(e){ $('pub').textContent='Publier'; $('pub').disabled=false; erreurEquipe(e); });
}
function confirmerPt(id){
  var o = $('veh'); var maj = o ? { vehicules:+o.textContent } : {};
  serveur('confirmerPoint', etat.mdp, id, maj).then(function(j){ fermer(); appliquer(j); toast('Confirmé'); }).catch(erreurEquipe);
}
function supprimerPt(id){ serveur('supprimerPoint', etat.mdp, id).then(function(j){ fermer(); appliquer(j); toast('Point retiré'); }).catch(erreurEquipe); }

// ----- Tracés -----
var traceEnCours = null, calqueDessin = L.layerGroup().addTo(carte);
var traceDoigt = false;
function commencerTrace(){ fermer(); traceEnCours = []; traceDoigt = false; document.body.classList.add('trace'); dessinerTraceEnCours(); }
function dessinerTraceEnCours(){
  calqueDessin.clearLayers();
  var n = traceEnCours.length;
  if (n > 1) {
    L.polyline(traceEnCours, { color:'#09090b', weight:11, opacity:.6, lineCap:'round', lineJoin:'round', interactive:false }).addTo(calqueDessin);
    L.polyline(traceEnCours, { color:'#ff5caa', weight:6, lineCap:'round', lineJoin:'round', interactive:false }).addTo(calqueDessin);
  }
  traceEnCours.forEach(function(ll, i){ if (traceDoigt && i > 0 && i < n-1) return;
    L.marker(ll, { interactive:false, icon:L.divIcon({ className:'', iconSize:[18,18], iconAnchor:[9,9], html:'<div class="sommet'+(i===0?' premier':'')+(i===n-1&&n>1?' dernier':'')+'"></div>' }) }).addTo(calqueDessin); });
  var d = longueurTrace(traceEnCours);
  modeAide((traceDoigt ? '<b>Dessine au doigt</b> sur la carte, dans le sens de la marche.' : '<b>Touche la carte</b> pour poser les points, dans le sens de la marche.')
    + (n > 1 ? '<br><span class="tr-live">📏 '+txtDistance(d)+' · 🚶 '+txtDuree(d, 5)+' à pied · '+n+' points</span>' : '')
    + '<div class="tr-outils"><button class="'+(!traceDoigt?'sel':'')+'" onclick="modeDoigt(false)">👆 Point par point</button><button class="'+(traceDoigt?'sel':'')+'" onclick="modeDoigt(true)">✍️ Au doigt</button></div>');
  $('barre-mode').innerHTML = '<button class="btn plein verre" onclick="annulerModes()">Annuler</button>'
    + '<button class="btn plein verre" onclick="annulerDernier()"'+(n?'':' disabled')+'>↩︎ Retour</button>'
    + '<button class="btn rose plein" onclick="finirTrace()"'+(n>1?'':' disabled')+'>'+ic('check')+'Terminer</button>';
}
function annulerDernier(){ if (traceDoigt) traceEnCours = traceEnCours.slice(0, Math.max(0, traceEnCours.length - 8)); else traceEnCours.pop(); dessinerTraceEnCours(); }
function modeDoigt(on){ traceDoigt = on; if (on) carte.dragging.disable(); else carte.dragging.enable(); document.body.classList.toggle('trace-doigt', on); dessinerTraceEnCours(); }
carte.on('click', function(e){ if (traceEnCours && !traceDoigt && document.body.classList.contains('trace') && traceEnCours.length < 120){ traceEnCours.push([e.latlng.lat, e.latlng.lng]); dessinerTraceEnCours(); } });
// Dessin au doigt : on suit le doigt et on garde un point tous les ~20 m
(function(){
  var el = carte.getContainer(), actif = false;
  function pt(ev){ var to = ev.touches ? ev.touches[0] : ev; var r = el.getBoundingClientRect(); var ll = carte.containerPointToLatLng([to.clientX - r.left, to.clientY - r.top]); return [ll.lat, ll.lng]; }
  function debut(ev){ if (!traceDoigt || !traceEnCours || (ev.touches && ev.touches.length > 1)) return; actif = true; ev.preventDefault(); var p = pt(ev);
    if (!traceEnCours.length || distance(traceEnCours[traceEnCours.length-1], p) > 15) traceEnCours.push(p); dessinerTraceEnCours(); }
  function bouge(ev){ if (!actif) return; ev.preventDefault(); var p = pt(ev), der = traceEnCours[traceEnCours.length-1];
    if (traceEnCours.length < 120 && (!der || distance(der, p) > 20)) { traceEnCours.push(p); dessinerTraceEnCours(); } }
  function fin(){ actif = false; }
  el.addEventListener('touchstart', debut, { passive:false }); el.addEventListener('touchmove', bouge, { passive:false }); el.addEventListener('touchend', fin);
  el.addEventListener('mousedown', debut); el.addEventListener('mousemove', function(e){ if (e.buttons) bouge(e); }); el.addEventListener('mouseup', fin);
})();
function finirTrace(){ brouillonTr = { coords:traceEnCours.slice(), type:null, note:'' }; if (traceDoigt) { traceDoigt = false; carte.dragging.enable(); document.body.classList.remove('trace-doigt'); } document.body.classList.remove('trace'); formulaireTrace(); }
function formulaireTrace(){
  var d = longueurTrace(brouillonTr.coords);
  var h = entete('Nouveau tracé', txtDistance(d) + ' · ' + brouillonTr.coords.length + ' points · C\'est quoi, ce tracé ?') + '<div class="grille">';
  Object.keys(TRACES).forEach(function(k){ var t=TRACES[k];
    h += '<button class="choix'+(brouillonTr.type===k?' sel':'')+'" onclick="brouillonTr.note=($(\'noteTr\')||{}).value||\'\';brouillonTr.type=\''+k+'\';formulaireTrace()"><span class="pt" style="background:'+t.couleur+'">'+t.e+'</span>'+t.nom
      + '<i class="trait-choix" style="background:'+(t.tirets?'repeating-linear-gradient(90deg,'+t.couleur+' 0 6px,transparent 6px 11px)':t.couleur)+'"></i></button>'; });
  h += '</div><label class="l">Précision (facultatif)</label><textarea id="noteTr" maxlength="200" placeholder="ex : départ 14h Bellecour, arrivée Jean Macé">'+esc(brouillonTr.note)+'</textarea>'
    + '<div class="rangee"><button class="btn plein" onclick="fermer();annulerModes()">Annuler</button><button id="pubTr" class="btn rose plein" onclick="publierTrace()"'+(brouillonTr.type?'':' disabled')+'>Publier</button></div>';
  if ($('feuille').dataset.vue === 'form') rafraichirFeuille(h); else ouvrir(h, 'form');
}
function publierTrace(){
  brouillonTr.note = $('noteTr').value; brouillonTr.par = etat.pseudo; $('pubTr').disabled = true; $('pubTr').textContent = '…';
  var envoi = brouillonTr, T = TRACES[brouillonTr.type];
  if (T && T.base) envoi = Object.assign({}, brouillonTr, { type:T.base, note:'[' + brouillonTr.type + '] ' + (brouillonTr.note||'') });
  serveur('ajouterTrace', etat.mdp, envoi).then(function(j){ annulerModes(); fermer(); appliquer(j); toast('Tracé publié'); })
    .catch(function(e){ $('pubTr').disabled=false; $('pubTr').textContent='Publier'; erreurEquipe(e); });
}
function confirmerTr(id){ serveur('confirmerTrace', etat.mdp, id).then(function(j){ fermer(); appliquer(j); toast('Confirmé'); }).catch(erreurEquipe); }
function supprimerTr(id){ serveur('supprimerTrace', etat.mdp, id).then(function(j){ fermer(); appliquer(j); toast('Tracé retiré'); }).catch(erreurEquipe); }

// ===================== ESPACE MEDICS =====================
function ouvrirMedics(){ dessinerMedics(false); }
function dessinerMedics(rafraichir){
  if (rafraichir && enEdition()) return;
  var h = entete('Espace medics', estAdmin() ? 'Vue admin de l\'équipe medic.' : 'Visible seulement par les medics et les admins.');
  if (estMedic()) {
    h += '<div class="ma-pos'+(partage.actif?'':' off')+'"><div class="etat"><i></i>'+(partage.actif ? 'Position partagée' : 'Position non partagée')+'</div>'
      + '<div class="sous" style="margin:4px 0 10px">'+(partage.actif ? (partage.mode==='gps' ? 'GPS, mise à jour automatique' : 'Placée à la main')+(partage.envoi ? ' · envoyée '+age(partage.envoi) : '') : 'Les gens et l\'équipe ne te voient pas sur la carte.')+'</div>'
      + '<div class="segments">' + Object.keys(STATUTS).map(function(s){ return '<button class="'+s+(partage.statut===s?' sel':'')+'" onclick="changerStatut(\''+s+'\')">'+STATUTS[s]+'</button>'; }).join('') + '</div>'
      + '<label class="interrupteur"><span>Visible par tout le monde<br><span style="font-size:12px;color:#9b9ba8">sinon : seulement l\'équipe</span></span><input type="checkbox" '+(partage.visible==='tous'?'checked':'')+' onchange="changerVisible(this.checked)"></label>'
      + '<div class="rangee">'
      + (partage.actif ? '<button class="btn plein" onclick="commencerPlacement(\'position\')">'+ic('position')+'Corriger</button><button class="btn rouge plein" onclick="arreterPartage()">Arrêter</button>'
                       : '<button class="btn vert plein" onclick="partagerGPS()">'+ic('cible')+'Partager (GPS)</button><button class="btn plein" onclick="commencerPlacement(\'position\')">'+ic('position')+'À la main</button>')
      + '</div></div>';
  }
  // Blessés
  var bl = etat.blesses.slice().sort(function(a,b){ var o={attente:0,prise:1}; var g={grave:0,moyen:1,leger:2}; return (o[a.statut]-o[b.statut]) || (g[a.gravite]-g[b.gravite]) || (a.cree-b.cree); });
  h += '<div class="section"><div class="section-titre"><h3>Blessés ('+bl.length+')</h3><button class="btn petit rose" onclick="commencerPlacement(\'blesse\')">'+ic('plus')+'Signaler</button></div>';
  if (!bl.length) h += '<div class="vide" style="padding:14px">Aucun blessé signalé.</div>';
  bl.forEach(function(b){
    var col = { grave:'#ff3b4e', moyen:'#ff9f1c', leger:'#d4a800' }[b.gravite];
    var dist = (partage.lat && estMedic()) ? ' · à '+Math.round(distance([partage.lat,partage.lng],[b.lat,b.lng]))+' m' : '';
    h += '<div class="msg" style="background:var(--s2)"><div class="m1"><span class="tag" style="background:'+col+'33;color:'+col+'">'+GRAVITES[b.gravite]+'</span>'
      + '<span>'+age(b.cree)+dist+'</span>'+(b.par?'<span style="margin-left:auto;text-transform:none">'+esc(b.par)+'</span>':'')+'</div>'
      + (b.note ? '<div class="m2">'+esc(b.note)+'</div>' : '')
      + '<div class="sous" style="margin:6px 0 0">'+(b.statut==='prise' ? 'Pris en charge par <b style="color:#7ff0b5">'+esc(b.prisPar||'un medic')+'</b>' : '<b style="color:#ff9aa5">En attente d\'un medic</b>')+'</div>'
      + '<div class="m3"><button class="btn petit" onclick="voirSur('+b.lat+','+b.lng+')">'+ic('position')+'Voir</button>'
      + (b.statut==='attente' ? '<button class="btn petit vert" onclick="majBl(\''+b.id+'\',\'prise\')">Je m\'en occupe</button>'
                              : '<button class="btn petit vert" onclick="majBl(\''+b.id+'\',\'fini\')">'+ic('check')+'Terminé</button><button class="btn petit" onclick="majBl(\''+b.id+'\',\'attente\')">Relâcher</button>')
      + '</div></div>';
  });
  h += '</div>';
  // Équipe
  var eq = etat.medics.slice().sort(function(a,b){ return (a.pseudo||'').localeCompare(b.pseudo||''); });
  h += '<div class="section"><div class="section-titre"><h3>Équipe sur le terrain ('+eq.length+')</h3>'
    + (estMedic() ? '<button class="btn petit" onclick="cible=\'point\';commencerPlacement(\'point\')">'+ic('plus')+'Poste / eau</button>' : '') + '</div>';
  if (!eq.length) h += '<div class="vide" style="padding:14px">Personne ne partage sa position pour l\'instant.</div>';
  eq.forEach(function(m){
    var moiAussi = estMedic() && m.id === monId;
    h += '<div class="ligne-eq"><span class="pt '+m.statut+'"></span><span class="nm">'+esc(m.pseudo||'Medic')+(moiAussi?' (toi)':'')+'</span><span class="ag">'+STATUTS[m.statut]+' · '+age(m.ts)+(m.visible==='equipe'?' · équipe':'')+'</span>'
      + '<button class="btn petit" onclick="voirSur('+m.lat+','+m.lng+')">'+ic('oeil')+'</button></div>';
  });
  h += '</div>';
  // Canal medics
  var msgs = messagesMedics();
  h += '<div class="section"><div class="section-titre"><h3>Canal medics</h3></div>' + composer(['medics']);
  if (!msgs.length) h += '<div class="vide" style="padding:14px">Pas encore de message.</div>';
  msgs.forEach(function(m){ h += carteMessage(m); });
  h += '</div>';
  if (rafraichir || $('feuille').dataset.vue === 'medics') rafraichirFeuille(h); else ouvrir(h, 'medics');
  marquerLus(msgs);
}
function ouvrirBlesse(id){
  var b = etat.blesses.filter(function(x){ return x.id===id; })[0]; if (!b) return;
  var h = entete('Blessé · ' + GRAVITES[b.gravite], 'Signalé ' + age(b.cree) + (b.par ? ' par ' + esc(b.par) : ''));
  if (b.note) h += '<div class="detail-note">'+esc(b.note)+'</div>';
  h += '<div class="sous">'+(b.statut==='prise' ? 'Pris en charge par '+esc(b.prisPar||'un medic') : 'En attente d\'un medic')+'</div>'

var monMarqueur = null, minuteurPartage = null;
function partagerGPS(){
  if (!navigator.geolocation) { toast('GPS indisponible : place-toi à la main'); return commencerPlacement('position'); }
  toast('Recherche du GPS…');
  navigator.geolocation.getCurrentPosition(function(pos){
    partage.mode = 'gps'; partage.lat = pos.coords.latitude; partage.lng = pos.coords.longitude; demarrerPartage();
  }, function(){ toast('GPS refusé ou indisponible ici : place-toi à la main'); commencerPlacement('position'); }, { enableHighAccuracy:true, timeout:12000 });
}
function demarrerPartage(){
  partage.actif = true; sauverPartage(); envoyerPosition(true);
  if (partage.mode === 'gps' && navigator.geolocation && partage.watch === null) {
    try { partage.watch = navigator.geolocation.watchPosition(function(pos){
      var nouv = [pos.coords.latitude, pos.coords.longitude];
      var bouge = !partage.lat || distance([partage.lat,partage.lng], nouv) > 20;
      partage.lat = nouv[0]; partage.lng = nouv[1]; majMaPosition();
      if (bouge && Date.now() - partage.envoi > 10000) envoyerPosition();
    }, function(){}, { enableHighAccuracy:true, maximumAge:10000 }); } catch(e){}
  }
  clearInterval(minuteurPartage);
  minuteurPartage = setInterval(function(){ if (partage.actif && !document.hidden) envoyerPosition(); }, 60000);
  majMaPosition(); dessinerOnglets();

    .then(function(j){ partage.envoi = Date.now(); sauverPartage(); appliquer(j); if (premier) toast('Position partagée avec ' + (partage.visible==='tous' ? 'tout le monde' : 'l\'équipe')); })
    .catch(function(e){ erreurEquipe(e); });

function sauverPartage(){ ecrireLS('partage6', JSON.stringify({ actif:partage.actif, mode:partage.mode, statut:partage.statut, visible:partage.visible, lat:partage.lat, lng:partage.lng })); }

function cap(a, b){ // degrés, 0 = nord
  var y = (b[1]-a[1]) * Math.cos(a[0]*Math.PI/180), x = b[0]-a[0];
  return (Math.atan2(y, x) * 180/Math.PI + 360) % 360;
}
function dirTexte(deg){ return ['nord','nord-est','est','sud-est','sud','sud-ouest','ouest','nord-ouest'][Math.round(deg/45) % 8]; }
function distTexte(m){ return m < 1000 ? Math.round(m/10)*10 + ' m' : (m/1000).toFixed(1).replace('.',',') + ' km'; }
function aPied(m){ var mn = Math.max(1, Math.round(m/80)); return '~' + mn + ' min'; }
function origineAutour(){

function ligneAutour(o, ll){

    + '<div class="txt"><b>'+esc(o.nom)+'</b><span>'+(o.sous ? esc(o.sous)+' · ' : '')+distTexte(d)+' · '+dirTexte(deg)+(o.danger ? '' : ' · '+aPied(d))+'</span></div>'
    + '<svg class="dir" viewBox="0 0 24 24" style="transform:rotate('+Math.round(deg)+'deg)"><path d="M12 3l6 16-6-4-6 4z"/></svg>'
    + '<button class="btn petit" onclick="voirSur('+o.lat+','+o.lng+')">'+ic('oeil')+'</button>'
    + (o.danger ? '' : '<a class="btn petit" target="_blank" href="https://maps.apple.com/?daddr='+o.lat+','+o.lng+'&dirflg=w">Y aller</a>')

function plusProche(liste, ll){

  // Dangers proches

  // Équipe : blessés en attente

  if (med) lignes.push({ lat:med.lat, lng:med.lng, nom:'Street medic en direct', sous:(STATUTS[med.statut]||'') + (med.pseudo ? ' · '+med.pseudo : ''), icone:'<div class="medic-live mini '+med.statut+'"><span class="emo">⛑️</span></div>' });
  ['medic','eau','sortie','rdv'].forEach(function(t){

  var ph = plusProche((PLAN.pharma||[]).map(function(x){ return { lat:x[1], lng:x[2], nom:x[0] || 'Pharmacie' }; }), ll);
  if (ph) lignes.push({ lat:ph.lat, lng:ph.lng, nom:ph.nom, sous:'pharmacie', icone:'<div class="pharma" style="flex:none;width:22px;height:22px;margin:0 4px"><svg viewBox="0 0 24 24"><path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/></svg></div>' });
  lignes.forEach(function(o){ h += ligneAutour(o, ll); });
  h += '<div class="sous" style="margin-top:12px">« Y aller » ouvre Plans en mode piéton. Vérifie toujours la carte : un point vert peut changer vite.</div>';
  if (rafraichir || $('feuille').dataset.vue === 'autour') rafraichirFeuille(h); else ouvrir(h, 'autour');

// ===================== V17 : désencombrement des étiquettes =====================
// Après chaque mouvement, on cache les étiquettes qui se chevauchent (les plus utiles gardent la place)
// et celles qui passent sous l'en-tête ou les boutons.
var ORDRE_LBL = ['.evt-etiq', '.info-etiq', '.st-nom', '.ecole-nom.fac', '.ecole-nom.lycee', '.repere span', '.nomrue span'];
function desencombrer(){
  var pris = [];
  document.querySelectorAll('#haut .barre > *, #ticker.vu, #compteurs .pastille, #flottants button, #onglets, .leaflet-marker-icon .pin, .evt-pin .ep-c, #carte .station, #carte .hosto').forEach(function(el){
    var r = el.getBoundingClientRect(); if (r.width) pris.push(r); });
  var H = window.innerHeight, W = window.innerWidth;
  ORDRE_LBL.forEach(function(sel){
    document.querySelectorAll('#carte ' + sel).forEach(function(el){
      el.classList.remove('cache-lbl');
      var r = el.getBoundingClientRect(); if (!r.width) return;
      if (r.right < 0 || r.left > W || r.bottom < 0 || r.top > H) return;
      if (r.left < 2 || r.right > W - 2) { el.classList.add('cache-lbl'); return; }
      var m = 3, gene = pris.some(function(q){ return r.left < q.right + m && r.right > q.left - m && r.top < q.bottom + m && r.bottom > q.top - m; });
      if (gene) el.classList.add('cache-lbl'); else pris.push(r);
    });
  });
}
var desencT = 0;

// Données : ecoles.json (Overture Maps / OpenStreetMap). Chaque bâtiment est dessiné à plat avec un petit

function nomCourt(n){

    .replace(/^Lycée privé /i, 'Lycée ').replace(/^Université Lumière - /, '').replace(/^Université Jean Moulin - /, '').replace(/ - Site /, ' · ').slice(0, 34);

function chargerEcoles(){

    e.b.forEach(function(b){ L.polygon(b.map(function(p){ return [p[0]+dy, p[1]+dx]; }), { renderer:rend, pane:'ecoles', stroke:false, fillColor:C.mur, fillOpacity:1, interactive:false }).addTo(calqueEcoles); }); });

// ----- Son des concerts (concert.mp3), joué à l'ouverture d'une fiche concert si le son est activé -----
var audioConcert = null;
function lancerConcert(){
  try {
    if (!audioConcert) { audioConcert = new Audio('concert.mp3'); audioConcert.preload = 'auto'; audioConcert.onended = majBoutonConcert; }
    audioConcert.currentTime = 0; audioConcert.volume = .85;
    var pr = audioConcert.play(); if (pr && pr.catch) pr.catch(function(){});
    document.body.classList.add('concert-son');
  } catch(e){}
  majBoutonConcert();
}
function stopConcert(){ if (audioConcert && !audioConcert.paused) audioConcert.pause(); document.body.classList.remove('concert-son'); majBoutonConcert(); }
function basculerConcert(){ if (audioConcert && !audioConcert.paused) stopConcert(); else lancerConcert(); }
function majBoutonConcert(){ var b = $('cc-son'); if (!b) return; var on = audioConcert && !audioConcert.paused && !audioConcert.ended;
  b.textContent = on ? '⏸ Couper le son' : '🔊 Écouter le son'; b.classList.toggle('on', !!on); if (!on) document.body.classList.remove('concert-son'); }

function decorConcert(){

  for (var k = 0; k < 22; k++) c += '<b style="left:'+((k*47)%100)+'%;background:'+cols[k%5]+';animation-duration:'+(2.2+(k%5)*.5)+'s;animation-delay:-'+((k*7)%30/10)+'s"></b>';

  if (txt.length > 6500) return Promise.reject('Trop d\'événements, supprime-en quelques-uns');
  return serveur('majConfig', etat.mdp, { evenements: txt }).then(function(j){
    appliquer(j);

  var debut = new Date(b.jour + 'T' + (b.journee ? '00:00' : b.hDebut)).getTime(), fin = b.journee ? new Date(b.jour + 'T23:59').getTime() : (b.hFin ? new Date(b.jour + 'T' + b.hFin).getTime() : 0);

  if (fin) v.fin = fin;
  if (b.journee) v.journee = 1;

}

  fermerBulleB.t = setTimeout(function(){ fermerBulleB(true); }, 9000);
}
function fermerBulleB(memoriser){
  clearTimeout(fermerBulleB.t); var el = $('bv-bulle'); if (!el) return;
  el.classList.remove('vu'); setTimeout(function(){ el.remove(); }, 400);
  if (memoriser) ecrireLS('bienvenue8', '1');
}
function finBienvenue(){ var b = $('bienvenue'); b.classList.remove('vu'); setTimeout(function(){ b.classList.remove('accueil'); }, 300); ecrireLS('bienvenue8','1'); setTimeout(verifierPopups, 400); }

// ----- Confort : texte plus grand -----
function basculerGrand(on){ grand = on; ecrireLS('grand8', on ? '1' : null); document.body.classList.toggle('grand', on); }

// ----- Épingles proches : on les écarte un peu pour qu'elles ne se cachent pas -----
function etaler(){
  var liste = Object.keys(marqueurs).map(function(id){ var m = marqueurs[id]; return { m:m, p:carte.latLngToContainerPoint(m.getLatLng()) }; });
  var vus2 = {}, groupes = [];
  liste.forEach(function(a, i){
    if (vus2[i]) return; var g = [a]; vus2[i] = 1;
    liste.forEach(function(b, j){ if (!vus2[j] && Math.abs(a.p.x-b.p.x) < 34 && Math.abs(a.p.y-b.p.y) < 34) { g.push(b); vus2[j] = 1; } });
    groupes.push(g);
  });
  groupes.forEach(function(g){
    var r = g.length > 1 ? 18 + 4*g.length : 0;
    g.forEach(function(o, k){
      var el = o.m._icon && o.m._icon.firstChild; if (!el) return;
      if (!r) { el.style.translate = ''; return; }
      var a = -Math.PI/2 + 2*Math.PI*k/g.length;
      el.style.translate = Math.round(Math.cos(a)*r) + 'px ' + Math.round(Math.sin(a)*r) + 'px';
    });
  });
}
carte.on('zoomend', function(){ setTimeout(etaler, 50); });
