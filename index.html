<style>
  :root {
    --rose:#ff6a1f; --rose2:#ffa064; --noir:#09090b; --s1:#171010; --s2:#221816; --s3:#2d211d; --ligne:#3a2a24;
    --txt:#f4f4f6; --doux:#ad9a90; --danger:#ff3b4e; --sur:#16c784; --info:#4f7cff; --orange:#ff9f1c; --jaune:#ffd23f;
    --haut:env(safe-area-inset-top); --bas:env(safe-area-inset-bottom);
    --verre:rgba(12,12,15,.82); --ombre:0 10px 30px rgba(0,0,0,.45);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--noir); color:var(--txt); overflow:hidden;
              font-family:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; -webkit-user-select:none; user-select:none; -webkit-font-smoothing:antialiased; }
  input, textarea { -webkit-user-select:text; user-select:text; }
  #carte { position:fixed; inset:0; bottom:auto; height:100vh; height:100lvh; min-height:100%; background:#141418; }
  html { background:#141418; min-height:calc(100% + env(safe-area-inset-bottom)); }
  .anton { font-family:Anton,Impact,sans-serif; letter-spacing:.5px; text-transform:uppercase; font-weight:400; }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; padding:0; }
  svg.ic { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .verre { background:var(--verre); -webkit-backdrop-filter:blur(18px) saturate(1.4); backdrop-filter:blur(18px) saturate(1.4); border:1px solid rgba(255,255,255,.08); }

  /* ---------- Écran de démarrage ---------- */
  #splash { position:fixed; inset:0; z-index:5000; background:#09090b; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity .5s, transform .5s; }
  #splash.parti { opacity:0; transform:scale(1.06); pointer-events:none; }
  #splash, #bienvenue.accueil { bottom:auto; height:100vh; height:100lvh; min-height:100%; }
  #splash::after { content:""; position:absolute; left:0; right:0; bottom:0; height:30%; background:linear-gradient(transparent, #09090b 75%); pointer-events:none; }
  .sp-bas { z-index:1; }
  #splash::before { content:""; position:absolute; inset:-20%; background:radial-gradient(circle at 50% 40%, #ff6a1f40 0%, transparent 42%), radial-gradient(circle at 15% 90%, #4f7cff30 0%, transparent 40%), radial-gradient(circle at 90% 10%, #ff6a1f22 0%, transparent 35%); animation:sp-respire 5s ease-in-out infinite; }
  @keyframes sp-respire { 50% { transform:scale(1.08) rotate(3deg); } }
  .sp-grille { position:absolute; inset:0; opacity:.22; background-image:linear-gradient(#ffffff14 1px, transparent 1px), linear-gradient(90deg, #ffffff14 1px, transparent 1px); background-size:34px 34px;
    -webkit-mask-image:radial-gradient(circle at 50% 42%, #000 0%, transparent 70%); mask-image:radial-gradient(circle at 50% 42%, #000 0%, transparent 70%); transform:perspective(500px) rotateX(35deg) scale(1.6); transform-origin:50% 70%; }
  .sp-centre { position:relative; display:flex; flex-direction:column; align-items:center; margin-top:-6vh; }
  .sp-logo { position:relative; width:150px; height:150px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; }
  .sp-logo svg { width:78px; height:78px; position:relative; filter:drop-shadow(0 8px 24px #ff6a1f99); animation:flotte 2.2s ease-in-out infinite; }
  .sp-logo i { position:absolute; inset:0; border-radius:50%; border:2px solid #ff6a1f; opacity:0; animation:sp-onde 2.4s ease-out infinite; }
  .sp-logo i:nth-child(2) { animation-delay:.8s; } .sp-logo i:nth-child(3) { animation-delay:1.6s; }
  @keyframes sp-onde { 0% { transform:scale(.3); opacity:.9; } 100% { transform:scale(1.25); opacity:0; } }
  @keyframes flotte { 50% { transform:translateY(-7px); } }
  #splash h1 { margin:0; font-family:Anton,Impact,sans-serif; font-weight:400; font-size:76px; line-height:.92; letter-spacing:1px; text-align:center; display:flex; flex-direction:column; }
  #splash h1 span { color:#fff; } #splash h1 b { font-weight:400; background:linear-gradient(90deg,#ff6a1f,#ffb27a,#ff6a1f); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:sp-brille 2.5s linear infinite; }
  @keyframes sp-brille { to { background-position:-200% 0; } }
  .sp-tag { margin-top:18px; display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:30px; background:#ffffff0f; border:1px solid #ffffff1a; color:#e6e6ea; font-size:12.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; }
  .sp-pt { width:8px; height:8px; border-radius:50%; background:#ff3b4e; box-shadow:0 0 0 0 #ff3b4e; animation:sp-live 1.4s infinite; }
  @keyframes sp-live { 70% { box-shadow:0 0 0 8px #ff3b4e00; } 100% { box-shadow:0 0 0 0 #ff3b4e00; } }
  .sp-bas { position:absolute; bottom:calc(var(--bas) + 46px); bottom:calc(100% - 100svh + var(--bas) + 46px); display:flex; flex-direction:column; align-items:center; gap:10px; color:var(--doux); font-size:12px; }
  #splash .barre-ch { width:180px; height:4px; border-radius:3px; background:#ffffff1a; overflow:hidden; }
  #splash .barre-ch i { display:block; height:100%; width:100%; border-radius:3px; background:linear-gradient(90deg,#ff6a1f,#ffb27a); box-shadow:0 0 10px #ff6a1f; transform-origin:left; transform:scaleX(.04); transition:transform .5s cubic-bezier(.2,.8,.2,1); }
  /* V23 : plan de Lyon qui se dessine + radar + lettres */
  .sp-plan { position:absolute; inset:0; width:100%; height:100%; opacity:.9;
    -webkit-mask-image:radial-gradient(ellipse 75% 60% at 50% 45%, #000 30%, transparent 85%); mask-image:radial-gradient(ellipse 75% 60% at 50% 45%, #000 30%, transparent 85%); }
  .sp-plan path { fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1; stroke-dashoffset:1; animation:sp-trace 1.8s cubic-bezier(.3,.6,.2,1) forwards; }
  .sp-plan .pl-eau { fill:#1d3f8a; fill-opacity:0; stroke:#4f7cff; stroke-width:2; animation:sp-trace 1.4s ease-out forwards, sp-eau .9s .9s forwards; filter:drop-shadow(0 0 6px #4f7cffaa); }
  .sp-plan .pl-moy { stroke:#ffffff26; stroke-width:1.4; animation-delay:.35s; animation-duration:2.2s; }
  .sp-plan .pl-gr { stroke:#ffffff55; stroke-width:2.2; animation-delay:.2s; }
  .sp-plan .pl-met { stroke:#ff6a1f; stroke-width:2.6; animation-delay:.7s; filter:drop-shadow(0 0 4px #ff6a1f); }
  @keyframes sp-trace { to { stroke-dashoffset:0; } }
  @keyframes sp-eau { to { fill-opacity:.55; } }
  .sp-radar { position:absolute; left:50%; top:42%; width:150vmax; height:150vmax; margin:-75vmax 0 0 -75vmax; border-radius:50%;
    background:conic-gradient(from 0deg, #ff6a1f00 0deg, #ff6a1f00 300deg, #ff6a1f30 350deg, #ff6a1f66 360deg); animation:sp-tour 3.2s linear infinite; mix-blend-mode:screen; opacity:.8;
    -webkit-mask-image:radial-gradient(circle, #000 0%, transparent 45%); mask-image:radial-gradient(circle, #000 0%, transparent 45%); }
  @keyframes sp-tour { to { transform:rotate(360deg); } }
  .sp-pts i { position:absolute; width:12px; height:12px; margin:-6px; border-radius:50%; background:var(--c); border:2px solid #fff; box-shadow:0 0 12px var(--c); transform:scale(0); animation:sp-pop .5s var(--d) cubic-bezier(.3,1.6,.5,1) forwards; }
  .sp-pts i::after { content:""; position:absolute; inset:-2px; border-radius:50%; border:2px solid var(--c); animation:sp-onde 1.8s var(--d) ease-out infinite; opacity:0; }
  @keyframes sp-pop { to { transform:scale(1); } }
  #splash h1 em { font-style:normal; display:inline-block; opacity:0; transform:translateY(40px) scale(.8); animation:sp-lettre .6s cubic-bezier(.2,1.4,.4,1) forwards; }
  #splash h1 span em:nth-child(1){animation-delay:.15s} #splash h1 span em:nth-child(2){animation-delay:.22s} #splash h1 span em:nth-child(3){animation-delay:.29s} #splash h1 span em:nth-child(4){animation-delay:.36s}
  #splash h1 b em:nth-child(1){animation-delay:.5s} #splash h1 b em:nth-child(2){animation-delay:.57s} #splash h1 b em:nth-child(3){animation-delay:.64s} #splash h1 b em:nth-child(4){animation-delay:.71s}
  #splash h1 b { -webkit-background-clip:initial; background:none; }
  #splash h1 b em { background:linear-gradient(90deg,#ff6a1f,#ffd0a8,#ff6a1f); background-size:400% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 18px #ff6a1f88); }
  @keyframes sp-lettre { to { opacity:1; transform:none; } }
  .sp-logo { animation:sp-entre .7s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes sp-entre { from { opacity:0; transform:scale(.4); } }
  .sp-tag { opacity:0; animation:sp-monte .5s .9s ease-out forwards; background:#0c0c11cc; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  @keyframes sp-monte { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  #sp-etape { transition:opacity .25s; min-height:16px; }
  #splash.parti { opacity:1; transform:none; clip-path:circle(0% at 50% 42%); transition:clip-path .65s cubic-bezier(.7,0,.3,1); }
  #splash { clip-path:circle(150% at 50% 42%); }
  @media (prefers-reduced-motion: reduce) { #splash *, #splash *::after { animation-duration:.01s !important; animation-delay:0s !important; } .sp-radar { display:none; } }
  @keyframes charge { from { transform:translateX(-100%); } to { transform:translateX(260%); } }

  /* ---------- En-tête ---------- */
  #haut { position:fixed; top:0; left:0; right:0; z-index:1000; padding:calc(var(--haut) + 8px) 10px 0; pointer-events:none; }
  .barre { display:flex; align-items:center; gap:10px; border-radius:18px; padding:8px 8px 8px 14px; pointer-events:auto; box-shadow:var(--ombre); }
  #titre { font-size:22px; line-height:1; white-space:nowrap; flex:1; }
  #titre b { color:var(--rose); font-weight:400; }
  #direct { font-size:10.5px; font-weight:800; letter-spacing:.8px; color:var(--doux); display:flex; align-items:center; gap:6px; white-space:nowrap; }
  #point-direct { width:8px; height:8px; border-radius:50%; background:var(--rose); animation:pulse 2s infinite; }
  #point-direct.hs { background:#666; animation:none; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 #ff6a1f99} 70%{box-shadow:0 0 0 8px #ff6a1f00} 100%{box-shadow:0 0 0 0 #ff6a1f00} }
  #role-badge { display:none; font-size:10px; font-weight:800; color:#000; background:var(--rose); padding:4px 7px; border-radius:7px; letter-spacing:.6px; }
  #role-badge.medic { background:var(--sur); }
  #btn-son { width:36px; height:36px; border-radius:12px; background:var(--s3); display:flex; align-items:center; justify-content:center; color:var(--txt); }
  #btn-son.off { color:var(--doux); }
  #ticker { display:none; margin-top:8px; pointer-events:auto; width:100%; text-align:left; border-radius:16px; padding:10px 12px 10px 14px; box-shadow:var(--ombre); position:relative; overflow:hidden; }
  #ticker::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--info); }
  #ticker.vu { display:block; }
  #ticker.important::before { background:var(--orange); }
  #ticker.epingle::before { background:var(--rose); }
  #ticker.urgent { background:rgba(60,8,14,.88); } #ticker.urgent::before { background:var(--danger); }
  #ticker .t1 { font-size:10.5px; color:var(--doux); font-weight:800; letter-spacing:.6px; text-transform:uppercase; margin-bottom:3px; display:flex; justify-content:space-between; }
  #ticker .t2 { font-size:15px; font-weight:600; line-height:1.3; }
  .info-etiq span { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  #compteurs { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; pointer-events:auto; }
  .pastille { font-size:12px; font-weight:700; padding:6px 10px; border-radius:20px; display:flex; align-items:center; gap:6px; }
  .pastille i { width:8px; height:8px; border-radius:50%; display:inline-block; }

  /* ---------- Boutons flottants ---------- */
  #flottants { position:fixed; right:10px; bottom:calc(var(--bas) + 100px); z-index:1000; display:flex; flex-direction:column; gap:10px; }
  .rond { width:48px; height:48px; border-radius:16px; display:flex; align-items:center; justify-content:center; box-shadow:var(--ombre); color:var(--txt); }
  .rond:active { transform:scale(.93); }

  /* ---------- Barre d'onglets ---------- */
  #onglets { position:fixed; left:10px; right:10px; bottom:calc(var(--bas) + 10px); z-index:1000; display:flex; gap:4px; padding:6px; border-radius:24px; box-shadow:var(--ombre); }
  .onglet { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:8px 2px 7px; border-radius:18px; font-size:10.5px; font-weight:700; color:#b9b9c4; position:relative; letter-spacing:.2px; }
  .onglet:active { background:var(--s3); }
  .onglet.fort { background:var(--rose); color:#000; box-shadow:0 4px 16px #ff6a1f55; }
  .onglet.fort.vert { background:var(--sur); box-shadow:0 4px 16px #16c78455; }
  .onglet.actif { color:var(--sur); }
  .onglet .badge { position:absolute; top:4px; left:50%; margin-left:5px; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--danger); color:#fff;
                   font-size:10.5px; font-weight:800; display:none; align-items:center; justify-content:center; border:2px solid #171010; }
  .onglet .badge.vu { display:flex; }

  /* ---------- Marqueurs ---------- */
  .pin { width:36px; height:36px; border-radius:50% 50% 50% 6px; transform:rotate(-45deg); display:flex; align-items:center; justify-content:center;
         border:2.5px solid #fff; box-shadow:0 4px 12px rgba(0,0,0,.55); position:relative; }
  .pin svg { transform:rotate(45deg); width:19px; height:19px; fill:none; stroke:#fff; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .pin.danger { background:var(--danger); } .pin.sur { background:var(--sur); } .pin.info { background:var(--info); } .pin.orange { background:#ff8a1f; }
  .pin.vieux { opacity:.5; filter:saturate(.3); }
  .pin.neuf::after { content:""; position:absolute; inset:-9px; border-radius:50%; border:2px solid var(--rose); animation:onde 1.6s infinite; }
  @keyframes onde { from{transform:scale(.7);opacity:1} to{transform:scale(1.35);opacity:0} }
  .pin .nb { position:absolute; top:-9px; right:-9px; transform:rotate(45deg); background:#fff; color:var(--danger); font-size:11px; font-weight:800;
             min-width:20px; height:20px; border-radius:10px; display:flex; align-items:center; justify-content:center; padding:0 4px; box-shadow:0 2px 6px #0008; }
  .bulle { padding:6px 10px; border-radius:14px 14px 14px 4px; background:#111116; border:2px solid var(--info); font-size:12px; font-weight:700; white-space:nowrap;
           max-width:190px; overflow:hidden; text-overflow:ellipsis; box-shadow:0 4px 12px #000a; transform:translate(0,-100%); display:inline-block; }
  .bulle.important { border-color:var(--orange); } .bulle.urgent { border-color:var(--danger); background:#3a0b12; }
  .bulle.medics { border-color:var(--sur); }
  .moi { width:18px; height:18px; border-radius:50%; background:#3d8bff; border:3px solid #fff; box-shadow:0 0 0 7px #3d8bff40; }
  .medic-live { width:34px; height:34px; border-radius:50%; background:var(--sur); border:3px solid #fff; display:flex; align-items:center; justify-content:center; position:relative; box-shadow:0 3px 10px #0009; }
  .medic-live svg { width:16px; height:16px; fill:#fff; stroke:none; }
  .medic-live::before { content:""; position:absolute; inset:-3px; border-radius:50%; border:3px solid var(--sur); animation:onde 2s infinite; }
  .medic-live.occupe { background:var(--orange); } .medic-live.occupe::before { border-color:var(--orange); }
  .medic-live.pause { background:#666; } .medic-live.pause::before { display:none; }
  .medic-live .ps { position:absolute; top:36px; left:50%; transform:translateX(-50%); white-space:nowrap; font-size:11px; font-weight:800; background:#000c; padding:2px 6px; border-radius:6px; }
  .blesse { width:36px; height:36px; border-radius:10px; background:#fff; border:3px solid var(--danger); display:flex; align-items:center; justify-content:center; box-shadow:0 3px 10px #0009; position:relative; }
  .blesse svg { width:20px; height:20px; fill:none; stroke:var(--danger); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
  .blesse.grave { animation:clig 1s infinite; } @keyframes clig { 50% { box-shadow:0 0 0 8px #ff3b4e55; } }
  .blesse.moyen { border-color:var(--orange); } .blesse.moyen svg { stroke:var(--orange); }
  .blesse.leger { border-color:#d4a800; } .blesse.leger svg { stroke:#d4a800; }
  .blesse.prise::after { content:"✓"; position:absolute; top:-8px; right:-8px; width:18px; height:18px; border-radius:50%; background:var(--sur); color:#fff; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .station { width:13px; height:13px; border-radius:50%; background:#fff; border:3px solid #333; box-shadow:0 1px 4px #000a; }
  .station-nom { position:absolute; left:10px; top:-8px; white-space:nowrap; font-size:11px; font-weight:800; color:#fff; text-shadow:0 0 3px #000,0 0 3px #000,0 0 5px #000; display:flex; gap:3px; align-items:center; }
  body.fond-clair .station-nom { color:#222; text-shadow:0 0 2px #fff,0 0 3px #fff,0 0 5px #fff; }
  .ligne-badge { width:15px; height:15px; border-radius:50%; color:#fff; font-size:9px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; text-shadow:none; }
  .hosto { width:24px; height:24px; border-radius:7px; background:#d7263d; border:2px solid #fff; color:#fff; font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px #0009; }
  .pharma { width:16px; height:16px; border-radius:4px; background:#18a558; border:1.5px solid #fff; display:flex; align-items:center; justify-content:center; }
  .pharma svg { width:10px; height:10px; fill:#fff; }
  .repere span { position:absolute; transform:translate(-50%,-50%); white-space:nowrap; font-family:Anton,Impact,sans-serif; text-transform:uppercase;
                 font-size:12.5px; letter-spacing:.8px; color:#ff6a1f; text-shadow:0 0 3px #000,0 0 3px #000,0 0 6px #000; pointer-events:none; opacity:.92; }
  body.zoom-loin .repere:not(.grand) span { display:none; }
  body.zoom-loin .repere.grand span { font-size:13.5px; }
  body.fond-clair .repere span { color:#c2410c; text-shadow:0 0 2px #fff,0 0 3px #fff,0 0 5px #fff; }
  .nomrue span { position:absolute; white-space:nowrap; font-size:11px; font-weight:600; letter-spacing:.2px; pointer-events:none; }
  .sommet { width:14px; height:14px; border-radius:50%; background:#fff; border:3px solid var(--rose); }

  /* ---------- Feuilles ---------- */
  #voile { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:1500; display:none; }
  .feuille { position:fixed; left:0; right:0; bottom:0; z-index:1600; background:var(--s1); border-radius:26px 26px 0 0;
             padding:14px 16px calc(var(--bas) + 20px); max-height:88vh; overflow:auto; -webkit-overflow-scrolling:touch;
             transform:translateY(105%); transition:transform .26s cubic-bezier(.2,.8,.2,1); border-top:1px solid var(--ligne); box-shadow:0 -10px 40px #000a; }
  .feuille.ouverte { transform:none; }
  .feuille h2 { margin:0 0 3px; font-size:28px; line-height:1.05; }

  body:not(.zoom-14) .scene-nom.g { display:none; }
  .scene-svg { width:100%; height:100%; display:block; overflow:visible; filter:drop-shadow(0 4px 8px #000a); }
  .scene-svg .sc-f { animation:scF 2.4s ease-in-out infinite alternate; transform-box:fill-box; }

  .scene-svg .sc-hp circle { animation:scHp .48s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:center; }
  .scene-svg .sc-fo circle { animation:scFo .9s ease-in-out infinite alternate; }
  .scene-svg .sc-fo circle:nth-child(2n) { animation-delay:-.45s; }

  @keyframes scL { 50% { opacity:.25; } }

    background:radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,0)); }

    border:2.5px solid var(--pg); box-shadow:0 0 8px var(--pg); animation:pin-onde 1.9s cubic-bezier(.2,.6,.3,1) infinite; will-change:transform, opacity; }

  /* fiches : le contenu arrive en cascade à l'ouverture */

  /* bandeau du haut : nouveau message = il glisse et brille */
  #ticker.vu { animation:tk-in .5s cubic-bezier(.2,1.2,.4,1) both; }

  /* ================= v37 : identité Traboule ================= */

// ----- Tracés : rendu -----
function longueurTrace(c){ var d = 0; for (var i = 1; i < c.length; i++) d += distance(c[i-1], c[i]); return d; }
function txtDistance(m){ return m < 1000 ? Math.round(m/10)*10 + ' m' : (m/1000).toFixed(1).replace('.', ',') + ' km'; }
function txtDuree(m, kmh){ var mn = Math.max(1, Math.round(m / (kmh*1000/60))); return mn < 60 ? mn + ' min' : Math.floor(mn/60) + ' h ' + ('0'+(mn%60)).slice(-2); }
function angleEntre(a, b){ return Math.atan2(b[0]-a[0], (b[1]-a[1])*Math.cos(b[0]*Math.PI/180)) * 180/Math.PI; }
function flecheIcone(ang, coul, taille){ taille = taille || 18;
  return L.divIcon({ className:'', iconSize:[taille,taille], iconAnchor:[taille/2,taille/2],
    html:'<svg class="chevron" width="'+taille+'" height="'+taille+'" viewBox="0 0 24 24" style="transform:rotate('+(-ang)+'deg)"><path d="M7 4 L17 12 L7 20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 4 L17 12 L7 20" fill="none" stroke="'+coul+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' }); }
function dessinerTrace(t, calque){
  var T = TRACES[t.type] || TRACES.cortege, c = t.coords;
  if (filtre==='danger' && T.g!=='danger') return;
  if (filtre==='sur' && T.g==='danger') return;
  var vieux = (maintenant() - t.ts) > VIEUX_MIN*60000, op = vieux ? .45 : 1;
  // contour sombre + halo coloré + ligne
  L.polyline(c, { color:'#09090b', weight:T.poids+6, opacity:vieux?.3:.7, lineCap:'round', lineJoin:'round', interactive:false }).addTo(calque);
  if (!vieux) L.polyline(c, { color:T.couleur, weight:T.poids+12, opacity:.16, lineCap:'round', lineJoin:'round', interactive:false, className:'tr-halo' }).addTo(calque);
  L.polyline(c, { color:T.couleur, weight:T.poids, dashArray:T.tirets, opacity:op, lineCap:'round', lineJoin:'round', interactive:false }).addTo(calque);
  if (T.anime && !vieux && !eco) L.polyline(c, { color:'#fff', weight:Math.max(2, T.poids-4), dashArray:'2 22', opacity:.75, lineCap:'round', interactive:false, className:'tr-flux' }).addTo(calque);
  L.polyline(c, { color:'#000', weight:28, opacity:0, lineCap:'round' }).on('click', function(){ ouvrirTrace(t.id); }).addTo(calque);
  // flèches de sens tous les ~250 m
  if (T.sens && c.length > 1) {
    var pas = 250, reste = pas * .6;
    for (var i = 1; i < c.length; i++) {
      var d = distance(c[i-1], c[i]), pos = reste;
      while (pos < d) { var f = pos / d, ll = [c[i-1][0] + (c[i][0]-c[i-1][0])*f, c[i-1][1] + (c[i][1]-c[i-1][1])*f];
        L.marker(ll, { interactive:false, keyboard:false, icon:flecheIcone(angleEntre(c[i-1], c[i]), T.couleur) }).addTo(calque); pos += pas; }
      reste = pos - d;
    }
  }
  // départ / arrivée
  if (T.sens && c.length > 1) {
    L.marker(c[0], { interactive:false, icon:L.divIcon({ className:'', iconSize:[22,22], iconAnchor:[11,11], html:'<div class="tr-depart" style="--tc:'+T.couleur+'"></div>' }) }).addTo(calque);
    L.marker(c[c.length-1], { icon:L.divIcon({ className:'', iconSize:[34,34], iconAnchor:[17,17], html:'<div class="tr-fin" style="--tc:'+T.couleur+'">'+(t.type==='cortege'||t.type==='prevu'?'🏁':T.e)+'</div>' }) })
      .on('click', function(){ ouvrirTrace(t.id); }).addTo(calque);
  } else if (c.length > 1) {
    var m = c[Math.floor((c.length-1)/2)], m2 = c[Math.floor((c.length-1)/2)+1] || m, mid = [(m[0]+m2[0])/2, (m[1]+m2[1])/2];
    L.marker(mid, { icon:L.divIcon({ className:'', iconSize:[30,30], iconAnchor:[15,15], html:'<div class="tr-fin" style="--tc:'+T.couleur+'">'+T.e+'</div>' }) })
      .on('click', function(){ ouvrirTrace(t.id); }).addTo(calque);
  }
}

// ===================== V24 : ADMIN TURBO =====================
// Barre rapide : 1 tap sur un type -> on place l'épingle -> Publier. Appui long : grille 1 tap.
// Les types les plus utilisés remontent tout seuls en premier.
var FAVORIS_BASE = ['police','controle','nasse','lacrymo','bloque','canon','interpel','medic','sortie','eau','info'];
function usages(){ try { return JSON.parse(lireLS('usage24') || '{}'); } catch(e){ return {}; } }
function noterUsage(t){ var u = usages(); u[t] = (u[t]||0) + 1; ecrireLS('usage24', JSON.stringify(u)); if (estAdmin()) dessinerRapide(); }
function favoris(n){
  var u = usages(), l = FAVORIS_BASE.filter(function(k){ return TYPES[k]; });
  Object.keys(u).forEach(function(k){ if (TYPES[k] && l.indexOf(k) < 0) l.push(k); });
  l.sort(function(a,b){ return (u[b]||0) - (u[a]||0) || FAVORIS_BASE.indexOf(a) - FAVORIS_BASE.indexOf(b); });
  return l.slice(0, n || 99);
}
function nomCourtType(k){ return (TYPES[k].nom || k).replace(/ \/.*$/, '').replace(/^Risque de /i, '').replace(/^(.)/, function(c){ return c.toUpperCase(); }); }
function puceType(k){ return '<i style="--gc:'+COULEURS_G[TYPES[k].g]+'">'+(EMOJI[k]||'ℹ️')+'</i>'; }
function dessinerRapide(){
  var el = $('rp-l'); if (!el) return;
  el.innerHTML = '<button class="rp-t" onclick="selecteurRapide()">⚡ Signaler</button>'
    + favoris(10).map(function(k){ return '<button onclick="commencerRapide(\''+k+'\')">'+puceType(k)+esc(nomCourtType(k))+'</button>'; }).join('');
}
var typeRapide = null;
function commencerRapide(k){
  if (k === 'info') { commencerPlacement('point'); return; }
  commencerPlacement('point'); typeRapide = k; cible = 'rapide';
  modeAide('<span class="rp-mode">'+puceType(k)+esc(TYPES[k].nom)+'</span><br><span style="color:#ad9a90">Mets l\'épingle au bon endroit puis « Publier ».</span>');
  $('barre-mode').innerHTML = '<button class="btn plein verre" onclick="annulerModes()">Annuler</button>'
    + '<button class="btn verre pos" onclick="rapideMaPosition()" aria-label="Ma position">'+ic('cible')+'</button>'
    + '<button class="btn rose plein" onclick="placerIci()">'+ic('check')+'Publier</button>';
}
function rapideMaPosition(){
  if (!navigator.geolocation) return toast('Position indisponible');
  toast('Localisation…');
  navigator.geolocation.getCurrentPosition(function(p){ carte.setView([p.coords.latitude, p.coords.longitude], Math.max(carte.getZoom(), 17)); toast('Épingle sur ta position, vérifie puis Publier'); },
    function(){ toast('Position refusée'); }, { enableHighAccuracy:true, timeout:8000, maximumAge:20000 });
}
function selecteurRapide(lat, lng){
  var ici = lat !== undefined;
  if (ici) brouillon = { lat:lat, lng:lng, type:null, vehicules:1 };
  var h = ici ? entete('Signaler ici', '1 tap = publié. Tu pourras préciser après.') : entete('Signaler', 'Choisis le type, puis place l\'épingle.');
  h += '<div class="rapide-g">' + favoris(12).filter(function(k){ return k !== 'info'; }).map(function(k){ return '<button onclick="'+(ici ? 'publierRapide' : 'commencerRapide')+'(\''+k+'\')">'+puceType(k)+esc(nomCourtType(k))+'</button>'; }).join('') + '</div>'
    + '<div class="rangee"><button class="btn plein" onclick="'+(ici ? 'formulaire()' : 'commencerPlacement(\'point\')')+'">ℹ️ Info / autre type…</button></div>';
  ouvrir(h, 'form');
}
function publierRapide(k, lat, lng){
  if (lat !== undefined) brouillon = { lat:lat, lng:lng, type:null, vehicules:1 };
  if (!brouillon) return;
  brouillon.type = k; brouillon.note = ''; brouillon.par = etat.pseudo;
  var ANCIENS = ['police','controle','nasse','bloque','lacrymo','danger','medic','eau','rdv','sortie','tete','sauvage','info'];
  var envoi = brouillon;
  if (ANCIENS.indexOf(k) < 0) { var g = TYPES[k].g; envoi = Object.assign({}, brouillon, { type: g === 'danger' ? 'danger' : g === 'sur' ? 'rdv' : 'info', note: '[' + k + '] ' }); }

// ----- Tracés -----
var traceEnCours = null, calqueDessin = L.layerGroup().addTo(carte);
var traceDoigt = false;
function commencerTrace(){ fermer(); traceEnCours = []; traceDoigt = false; document.body.classList.add('trace'); dessinerTraceEnCours(); }
function dessinerTraceEnCours(){
  calqueDessin.clearLayers();
  var n = traceEnCours.length;
  if (n > 1) {
    L.polyline(traceEnCours, { color:'#09090b', weight:11, opacity:.6, lineCap:'round', lineJoin:'round', interactive:false }).addTo(calqueDessin);
    L.polyline(traceEnCours, { color:'#ff5caa', weight:6, lineCap:'round', lineJoin:'round', interactive:false }).addTo(calqueDessin);
  }
  traceEnCours.forEach(function(ll, i){ if (traceDoigt && i > 0 && i < n-1) return;
    L.marker(ll, { interactive:false, icon:L.divIcon({ className:'', iconSize:[18,18], iconAnchor:[9,9], html:'<div class="sommet'+(i===0?' premier':'')+(i===n-1&&n>1?' dernier':'')+'"></div>' }) }).addTo(calqueDessin); });
  var d = longueurTrace(traceEnCours);
  modeAide((traceDoigt ? '<b>Dessine au doigt</b> sur la carte, dans le sens de la marche.' : '<b>Touche la carte</b> pour poser les points, dans le sens de la marche.')
    + (n > 1 ? '<br><span class="tr-live">📏 '+txtDistance(d)+' · 🚶 '+txtDuree(d, 5)+' à pied · '+n+' points</span>' : '')
    + '<div class="tr-outils"><button class="'+(!traceDoigt?'sel':'')+'" onclick="modeDoigt(false)">👆 Point par point</button><button class="'+(traceDoigt?'sel':'')+'" onclick="modeDoigt(true)">✍️ Au doigt</button></div>');
  $('barre-mode').innerHTML = '<button class="btn plein verre" onclick="annulerModes()">Annuler</button>'
    + '<button class="btn plein verre" onclick="annulerDernier()"'+(n?'':' disabled')+'>↩︎ Retour</button>'
    + '<button class="btn rose plein" onclick="finirTrace()"'+(n>1?'':' disabled')+'>'+ic('check')+'Terminer</button>';
}
function annulerDernier(){ if (traceDoigt) traceEnCours = traceEnCours.slice(0, Math.max(0, traceEnCours.length - 8)); else traceEnCours.pop(); dessinerTraceEnCours(); }
function modeDoigt(on){ traceDoigt = on; if (on) carte.dragging.disable(); else carte.dragging.enable(); document.body.classList.toggle('trace-doigt', on); dessinerTraceEnCours(); }
carte.on('click', function(e){ if (traceEnCours && !traceDoigt && document.body.classList.contains('trace') && traceEnCours.length < 120){ traceEnCours.push([e.latlng.lat, e.latlng.lng]); dessinerTraceEnCours(); } });
// Dessin au doigt : on suit le doigt et on garde un point tous les ~20 m
(function(){
  var el = carte.getContainer(), actif = false;
  function pt(ev){ var to = ev.touches ? ev.touches[0] : ev; var r = el.getBoundingClientRect(); var ll = carte.containerPointToLatLng([to.clientX - r.left, to.clientY - r.top]); return [ll.lat, ll.lng]; }
  function debut(ev){ if (!traceDoigt || !traceEnCours || (ev.touches && ev.touches.length > 1)) return; actif = true; ev.preventDefault(); var p = pt(ev);
    if (!traceEnCours.length || distance(traceEnCours[traceEnCours.length-1], p) > 15) traceEnCours.push(p); dessinerTraceEnCours(); }
  function bouge(ev){ if (!actif) return; ev.preventDefault(); var p = pt(ev), der = traceEnCours[traceEnCours.length-1];
    if (traceEnCours.length < 120 && (!der || distance(der, p) > 20)) { traceEnCours.push(p); dessinerTraceEnCours(); } }
  function fin(){ actif = false; }
  el.addEventListener('touchstart', debut, { passive:false }); el.addEventListener('touchmove', bouge, { passive:false }); el.addEventListener('touchend', fin);
  el.addEventListener('mousedown', debut); el.addEventListener('mousemove', function(e){ if (e.buttons) bouge(e); }); el.addEventListener('mouseup', fin);
})();

// ----- Partage de position (medics) -----
var monMarqueur = null, minuteurPartage = null;
function partagerGPS(){
  if (!navigator.geolocation) { toast('GPS indisponible : place-toi à la main'); return commencerPlacement('position'); }
  toast('Recherche du GPS…');
  navigator.geolocation.getCurrentPosition(function(pos){
    partage.mode = 'gps'; partage.lat = pos.coords.latitude; partage.lng = pos.coords.longitude; demarrerPartage();
  }, function(){ toast('GPS refusé ou indisponible ici : place-toi à la main'); commencerPlacement('position'); }, { enableHighAccuracy:true, timeout:12000 });
}
function demarrerPartage(){
  partage.actif = true; sauverPartage(); envoyerPosition(true);
  if (partage.mode === 'gps' && navigator.geolocation && partage.watch === null) {
    try { partage.watch = navigator.geolocation.watchPosition(function(pos){
      var nouv = [pos.coords.latitude, pos.coords.longitude];
      var bouge = !partage.lat || distance([partage.lat,partage.lng], nouv) > 20;
      partage.lat = nouv[0]; partage.lng = nouv[1]; majMaPosition();
      if (bouge && Date.now() - partage.envoi > 10000) envoyerPosition();
    }, function(){}, { enableHighAccuracy:true, maximumAge:10000 }); } catch(e){}
  }
  clearInterval(minuteurPartage);
  minuteurPartage = setInterval(function(){ if (partage.actif && !document.hidden) envoyerPosition(); }, 60000);
  majMaPosition(); dessinerOnglets();
  if ($('feuille').dataset.vue === 'medics') dessinerMedics(true); else ouvrirMedics();
}
function envoyerPosition(premier){
  if (!partage.actif || partage.lat === null) return;
  serveur('majPosition', etat.mdp, { id:monId, pseudo:etat.pseudo, lat:partage.lat, lng:partage.lng, statut:partage.statut, visible:partage.visible })
    .then(function(j){ partage.envoi = Date.now(); sauverPartage(); appliquer(j); if (premier) toast('Position partagée avec ' + (partage.visible==='tous' ? 'tout le monde' : 'l\'équipe')); })
    .catch(function(e){ erreurEquipe(e); });
}
function arreterPartage(silencieux){
  partage.actif = false; sauverPartage();
  if (partage.watch !== null) { try { navigator.geolocation.clearWatch(partage.watch); } catch(e){} partage.watch = null; }
  clearInterval(minuteurPartage);
  if (etat.mdp) serveur('arreterPosition', etat.mdp, monId).then(function(j){ appliquer(j); if (!silencieux) toast('Tu n\'es plus visible sur la carte'); }).catch(function(){});
  majMaPosition(); dessinerOnglets();
  if ($('feuille').dataset.vue === 'medics') dessinerMedics(true);
}

function changerVisible(tous){ partage.visible = tous ? 'tous' : 'equipe'; sauverPartage(); if (partage.actif) envoyerPosition(); dessinerMedics(true); }
function sauverPartage(){ ecrireLS('partage6', JSON.stringify({ actif:partage.actif, mode:partage.mode, statut:partage.statut, visible:partage.visible, lat:partage.lat, lng:partage.lng })); }
function majMaPosition(){

  ouvrir(entete('🗓️ Événements', 'Ils restent sur la carte et dans l\'agenda jusqu\'à leur fin, sans rien confirmer. Ensuite ils disparaissent tout seuls.')
    + '<div class="rangee" style="margin-top:4px"><button class="btn rose plein" onclick="nouvelEvt()">'+ic('plus')+'Nouvel événement</button><button class="btn plein" onclick="ouvrirBlocusSerie()">🚧 Blocus en série</button></div>'
    + suggestionsEvt()
    + (avenir.length ? listeAgenda(avenir, true) : '<div class="vide" style="padding:14px">Aucun événement à venir.</div>')
    + (passes ? '<div class="sous" style="margin-top:6px">'+passes+' événement'+(passes>1?'s':'')+' terminé'+(passes>1?'s':'')+', retiré'+(passes>1?'s':'')+' automatiquement au prochain enregistrement.</div>' : '')
    + '<div class="rangee"><button class="btn plein" onclick="dessinerGestion()">Retour</button></div>', 'evt-gestion');
}

// Événements préparés à l'avance : un appui ouvre le formulaire déjà rempli
var SUGG_EVT = [
  { cle:'rasso-p2a-0211', jusqua:new Date('2026-11-03T00:00').getTime(), cat:'rassemb', titre:'Rassemblement Lyon 2 Porte des Alpes', jour:'2026-11-02', journee:true,
    lieu:'Campus Porte des Alpes, Bron', lat:45.72251, lng:4.91662, texte:'Rassemblement toute la journée sur le campus Porte des Alpes (Lyon 2, Bron). Tram T2 arrêt Europe – Université.' }
];
function suggestionsEvt(){
  var deja = evenements().map(function(v){ return v.titre; });
  return SUGG_EVT.filter(function(x){ return Date.now() < x.jusqua && deja.indexOf(x.titre) < 0; }).map(function(x, i){
    return '<button class="prep5" onclick="utiliserSugg('+SUGG_EVT.indexOf(x)+')"><span>📣</span><div><b>'+esc(x.titre)+'</b><small>Lun. 2 novembre · toute la journée · prêt à publier</small></div></button>'; }).join('');
}
function utiliserSugg(i){ var x = SUGG_EVT[i];
  brouillonEvt = { id:null, cat:x.cat, emoji:'', titre:x.titre, jour:x.jour, hDebut:'08:00', hFin:'', journee:x.journee, lieu:x.lieu, texte:x.texte, lat:x.lat, lng:x.lng };
  formulaireEvt(); }
function isoJour(ts){ var d = new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isoHeure(ts){ var d = new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function nouvelEvt(){
  var d = new Date(Date.now()+86400000); d.setHours(18,0,0,0);
  brouillonEvt = { id:null, cat:'rassemb', emoji:'', titre:'', jour:isoJour(d), hDebut:'18:00', hFin:'', lieu:'', texte:'', lat:null, lng:null };
  formulaireEvt();
}
function editerEvt(id){
  var v = evenements().filter(function(x){ return x.id === id; })[0]; if (!v) return;
  brouillonEvt = { id:v.id, cat:v.cat||'autre', emoji:v.emoji||'', titre:v.titre, jour:isoJour(v.debut), hDebut:isoHeure(v.debut), hFin:v.fin ? isoHeure(v.fin) : '', journee:!!v.journee, lieu:v.lieu||'', texte:v.texte||'', lat:v.lat, lng:v.lng, but:v.but||'', butTxt:v.butTxt||'' };
  formulaireEvt();
}
function lireFormEvt(){ if (!$('ev-titre')) return; var b = brouillonEvt; if ($('ev-but')) b.butTxt = $('ev-but').value;
  b.titre = $('ev-titre').value; b.jour = $('ev-jour').value; b.hDebut = $('ev-deb').value || b.hDebut; b.hFin = $('ev-fin').value; b.lieu = $('ev-lieu').value; b.texte = $('ev-txt').value; }
function formulaireEvt(){
  var b = brouillonEvt, C = CATS_EVT[b.cat] || CATS_EVT.autre;
  var h = entete(b.id ? 'Modifier l\'événement' : 'Nouvel événement', 'Enregistré directement, visible par tout le monde.')
    + '<label class="l">Type</label><div class="evt-cats">' + Object.keys(CATS_EVT).map(function(k){ var c = CATS_EVT[k];
        return '<button class="'+(b.cat===k?'sel':'')+'" style="--ec:'+c.c+'" onclick="lireFormEvt();brouillonEvt.cat=\''+k+'\';formulaireEvt()"><span>'+c.e+'</span>'+c.nom+'</button>'; }).join('') + '</div>'
    + (b.cat === 'sauvage' ? '<label class="l">Dans quel but ?</label><div class="evt-cats sv-buts">' + Object.keys(BUTS_SV).map(function(k){ var x = BUTS_SV[k];
        return '<button class="'+(b.but===k?'sel':'')+'" style="--ec:#ff8a1f" onclick="lireFormEvt();brouillonEvt.but=\''+k+'\';formulaireEvt()"><span>'+x.e+'</span>'+x.nom+'</button>'; }).join('') + '</div>'
        + '<input id="ev-but" maxlength="50" placeholder="Préciser (facultatif) : ex. Bloquer le périph nord" value="'+esc(b.butTxt||'')+'" style="margin-top:6px">'
        + '<div class="sous" style="margin:4px 0 0">Ce qui est publié ici est visible par tout le monde, police comprise. Ne mets ni noms ni détails que tu veux garder pour toi.</div>' : '')
    + '<label class="l">Nom de l\'événement</label><input id="ev-titre" maxlength="60" placeholder="ex : Rassemblement contre la loi" value="'+esc(b.titre)+'">'
    + '<label class="l">Quand</label><label class="interrupteur" style="margin:0 0 8px"><span>Toute la journée</span><input type="checkbox" '+(b.journee?'checked':'')+' onchange="lireFormEvt();brouillonEvt.journee=this.checked;formulaireEvt()"></label><div class="evt-heures'+(b.journee?' journee':'')+'"><input id="ev-jour" type="date" value="'+esc(b.jour)+'"><div><label>Début</label><input id="ev-deb" type="time" value="'+esc(b.hDebut)+'"></div><div><label>Fin (facultatif)</label><input id="ev-fin" type="time" value="'+esc(b.hFin)+'"></div></div>'
    + '<div class="sous" style="margin:4px 0 0">Jour, début, fin (la fin est facultative : sinon il disparaît 3 h après le début).</div>'
    + '<label class="l">Lieu</label><input id="ev-lieu" maxlength="60" placeholder="ex : Place Bellecour" value="'+esc(b.lieu)+'">'
    + '<div class="rangee" style="margin-top:8px"><button class="btn plein" onclick="lireFormEvt();commencerPlacement(\'evt\')">'+ic('position')+(b.lat !== null && b.lat !== undefined ? 'Changer l\'endroit' : 'Placer sur la carte')+'</button>'
    + (b.lat !== null && b.lat !== undefined ? '<button class="btn plein" onclick="lireFormEvt();brouillonEvt.lat=null;brouillonEvt.lng=null;formulaireEvt()">Retirer de la carte</button>' : '') + '</div>'
    + (b.lat !== null && b.lat !== undefined ? '<div class="evt-lieu-ok">✓ Placé sur la carte</div>' : '')
    + '<label class="l">Détails (facultatif)</label><textarea id="ev-txt" maxlength="400" placeholder="Ce qu\'il faut savoir : parcours, quoi ramener, contacts publics…">'+esc(b.texte)+'</textarea>'
    + '<div class="rangee"><button class="btn plein" onclick="gererEvenements()">Retour</button><button class="btn rose plein" id="ev-go" onclick="sauverEvt()">'+(b.id ? 'Enregistrer' : 'Publier')+'</button></div>'
    + (b.id ? '<div class="rangee"><button class="btn rouge plein" onclick="supprimerEvt(\''+b.id+'\')">Supprimer l\'événement</button></div>' : '');
  if (['evt-form'].indexOf($('feuille').dataset.vue) >= 0) rafraichirFeuille(h); else ouvrir(h, 'evt-form');
}
function enregistrerEvts(liste, msg){
  var n = maintenant();
  liste = liste.filter(function(v){ return finEvt(v) > n - 86400000; }).slice(-40);
  var txt = JSON.stringify(liste);
  if (txt.length > 6500) return Promise.reject('Trop d\'événements, supprime-en quelques-uns');
  return serveur('majConfig', etat.mdp, { evenements: txt }).then(function(j){
    appliquer(j);
    if ((etat.config || {}).evenements !== txt) { toast('Ton serveur Google doit être mis à jour pour les événements (voir le message de Claude)'); return; }
    toast(msg); gererEvenements();
  });
}
function sauverEvt(){
  lireFormEvt(); var b = brouillonEvt;
  if (!b.titre.trim()) { $('ev-titre').focus(); return toast('Donne un nom à l\'événement'); }
  if (!b.jour || (!b.hDebut && !b.journee)) return toast('Choisis le jour et l\'heure');
  var debut = new Date(b.jour + 'T' + (b.journee ? '00:00' : b.hDebut)).getTime(), fin = b.journee ? new Date(b.jour + 'T23:59').getTime() : (b.hFin ? new Date(b.jour + 'T' + b.hFin).getTime() : 0);
  if (fin && fin <= debut) fin += 86400000;
  var C = CATS_EVT[b.cat] || CATS_EVT.autre;
  var v = { id: b.id || ('e' + Date.now().toString(36)), cat:b.cat, emoji:C.e, titre:b.titre.trim().slice(0,60), debut:debut, lieu:b.lieu.trim().slice(0,60), texte:b.texte.trim().slice(0,400) };
  if (fin) v.fin = fin;
  if (b.journee) v.journee = 1;
  if (b.cat === 'sauvage') { if (BUTS_SV[b.but]) v.but = b.but; if ((b.butTxt||'').trim()) v.butTxt = b.butTxt.trim().slice(0,50); }
  if (b.lat !== null && b.lat !== undefined) { v.lat = Math.round(b.lat*1e5)/1e5; v.lng = Math.round(b.lng*1e5)/1e5; }
  var l = evenements().filter(function(x){ return x.id !== v.id; }); l.push(v);
  $('ev-go').disabled = true; $('ev-go').textContent = '…';
  enregistrerEvts(l, b.id ? 'Événement modifié' : 'Événement publié 🎉').catch(function(e){ if ($('ev-go')) { $('ev-go').disabled = false; $('ev-go').textContent = 'Réessayer'; } erreurEquipe(e); });
}
function supprimerEvt(id){
  enregistrerEvts(evenements().filter(function(x){ return x.id !== id; }), 'Événement supprimé').catch(erreurEquipe);
}

function rond(x, a, b, w, h, r){ x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }
